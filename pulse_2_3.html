    <nav class="tabs">
      <button data-tab="today" class="${State.activeTab==='today'?'active':''}">Today</button>
      <button data-tab="workout" class="${State.activeTab==='workout'?'active':''}">Workout</button>
      <button data-tab="progress" class="${State.activeTab==='progress'?'active':''}">Progress</button>
      <button data-tab="coach" class="${State.activeTab==='coach'?'active':''}">Coach</button>
    </nav>

    ${State.activeTab==='today' ? renderTodayTab(dateKey, entries, totals, goals, water, weekTotals, maxWeekCal, dow) : ''}
    ${State.activeTab==='workout' ? renderWorkoutTab(dateKey, workout) : ''}
    ${State.activeTab==='progress' ? renderProgressTab(weightHistory) : ''}
    ${State.activeTab==='coach' ? renderCoachTab() : ''}
  `;
}

function weekAvgCalories(weekTotals){
  const today=new Date();
  const logged=weekTotals.filter(w=>w.cal>0 && !Utils.isSameDay(w.date,today)); // today is still in progress
  if(!logged.length) return null;
  return { avg: logged.reduce((s,w)=>s+w.cal,0)/logged.length, days: logged.length };
}

function renderTodayTab(dateKey, entries, totals, goals, water, weekTotals, maxWeekCal, dow){
  const calPct = goals.calories>0 ? totals.calories/goals.calories : 0;
  const weekAvg=weekAvgCalories(weekTotals);
  const macros=[
    {key:'protein', label:'Protein', color:'var(--protein)', val:totals.protein, goal:goals.protein},
    {key:'carbs', label:'Carbs', color:'var(--carbs)', val:totals.carbs, goal:goals.carbs},
    {key:'fat', label:'Fat', color:'var(--fat)', val:totals.fat, goal:goals.fat}
  ];
  const waterPct = goals.waterMl>0 ? water.ml/goals.waterMl : 0;

  return `
    <div class="datebar">
      <div class="dnav">
        <button class="navbtn" id="date-prev">←</button>
        <div class="dlabel">${Utils.esc(Utils.prettyDate(State.currentDate))}</div>
        <button class="navbtn" id="date-next">→</button>
      </div>
      ${Utils.dateKey(State.currentDate)!==Utils.dateKey(new Date()) ? `<button class="today-pill" id="date-today">Jump to today</button>` : ''}
    </div>

    <div class="grid overview">
      <div class="card">
        <div class="card-head">
          <div><p class="card-title">Nutrition</p><p class="card-sub">${totals.calories} of ${goals.calories} kcal · ${Utils.roundInt(calPct*100)}%</p></div>
        </div>
        <div class="ring-row">
          <div class="ring-wrap">
            ${ringSvg(calPct, 'var(--accent)')}
            <div class="ring-center">
              <div class="ring-num">${Utils.roundInt(calPct*100)}%</div>
              <div class="ring-lbl">${Utils.roundInt(Math.max(0,goals.calories-totals.calories))} kcal left</div>
            </div>
          </div>
          <div class="macro-list">
            ${macros.map(m=>{
              const pct=m.goal>0?Utils.clamp(m.val/m.goal,0,1):0;
              return `<div class="macro-row">
                <span class="swatch" style="background:${m.color}"></span>
                <span style="width:52px;flex:none;">${m.label}</span>
                <span class="bar-track"><span class="bar-fill" style="width:${pct*100}%;background:${m.color}"></span></span>
                <span class="amt">${Utils.roundInt(m.val)}/${m.goal}g · ${Utils.roundInt(pct*100)}%</span>
              </div>`;
            }).join('')}
          </div>
        </div>
        <p class="card-sub" style="margin-bottom:6px;">This week</p>
        <div class="week">
          ${weekTotals.map(w=>{
            const h=Utils.clamp((w.cal/maxWeekCal)*100,2,100);
            const active=Utils.isSameDay(w.date,State.currentDate);
            return `<div class="col ${active?'active':''}"><div class="bar" style="height:${h}%"></div><div class="dow">${dow[w.date.getDay()]}</div></div>`;
          }).join('')}
        </div>
        ${weekAvg ? `<p class="card-sub" style="margin-top:8px;">7-day avg: <strong style="color:var(--ink);">${Utils.roundInt(weekAvg.avg)} kcal</strong> (over ${weekAvg.days} completed day${weekAvg.days===1?'':'s'}, today excluded) — steadier signal than a single day.</p>` : ''}
      </div>

      <div class="card water-card">
        <div class="card-head">
          <div><p class="card-title">Water</p><p class="card-sub">Goal: ${Math.round(goals.waterMl/1000*10)/10} L</p></div>
        </div>
        <div class="amount">${Math.round(water.ml/10)/100} L</div>
        <div class="water-track"><div class="water-fill" style="width:${Utils.clamp(waterPct*100,0,100)}%"></div></div>
        <div class="water-btns">
          <button class="chip-btn" data-water="250">+250 ml</button>
          <button class="chip-btn" data-water="500">+500 ml</button>
          <button class="chip-btn minus" data-water="-250">−250 ml</button>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:16px;">
      <div class="card-head">
        <div><p class="card-title">Food log</p><p class="card-sub">${Utils.esc(Utils.prettyDate(State.currentDate))}</p></div>
      </div>
      ${MEAL_TYPES.map(mt=>renderMealBlock(mt, entries.filter(e=>e.mealType===mt.id))).join('')}
    </div>
  `;
}

function renderMealBlock(mealType, mealEntries){
  const cal=Calc.totals(mealEntries).calories;
  const isOpen = State.addPanel.open && State.addPanel.meal===mealType.id;
  const smd=State.saveMealDraft;
  const isSaving = smd.open && smd.mealType===mealType.id;
  return `
  <div class="meal-block" data-meal-block="${mealType.id}">
    <div class="meal-head">
      <div class="meal-name"><span class="dot" style="background:${mealType.color}"></span>${mealType.label}</div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="meal-cal">${Utils.roundInt(cal)} kcal</span>
        <button class="add-chip" data-open-add="${mealType.id}" title="Add food">${isOpen?'−':'+'}</button>
      </div>
    </div>
    ${mealEntries.length ? mealEntries.map(e=>renderEntryRow(e)).join('') : `<div class="empty">No foods logged yet</div>`}
    ${mealEntries.length ? `<div style="margin-top:6px;">${isSaving ? '' : `<button class="link-btn" data-save-meal="${mealType.id}">💾 Save as meal</button>`}</div>` : ''}
    ${isSaving ? `
      <div class="add-panel">
        <div class="field"><label>Name this meal</label><input type="text" id="savemeal-name" value="${Utils.esc(smd.name)}" placeholder="e.g. Greek yogurt + raspberries"/></div>
        <div style="display:flex;gap:8px;">
          <button class="btn accent" id="savemeal-confirm">Save</button>
          <button class="btn secondary" id="savemeal-cancel">Cancel</button>
        </div>
      </div>` : ''}
    ${isOpen ? renderAddPanel() : ''}
  </div>`;
}

function renderEntryRow(e){
  const tagClass = e.source==='db' ? 'db' : e.source==='ai' ? 'ai' : e.source==='web' ? 'web' : 'manual';
  const tagLabel = e.source==='db' ? 'DB' : e.source==='ai' ? 'AI' : e.source==='web' ? 'WEB' : 'MANUAL';
  const metaParts=[];
  if(e.quantity && e.unit) metaParts.push(`${e.quantity} ${e.unit}`);
  metaParts.push(`P${Utils.roundInt(e.protein)} C${Utils.roundInt(e.carbs)} F${Utils.roundInt(e.fat)}`);
  return `<div class="entry" data-entry-id="${e.id}">
    <div class="info">
      <div class="ename">${Utils.esc(e.name)}</div>
      <div class="emeta"><span class="tag ${tagClass}">${tagLabel}</span><span>${Utils.esc(metaParts.join(' · '))}</span></div>
    </div>
    <div class="eright">
      <div class="ecal">${Utils.roundInt(e.calories)}</div>
      <button class="del" data-del-entry="${e.id}" title="Remove">×</button>
    </div>
  </div>`;
}

function renderWebFoodBlock(){
  const ap=State.addPanel;
  const q=ap.query.trim();
  if(q.length<2) return '';
  if(ap.webQueriedFor===q){
    if(ap.webStatus==='loading') return `<div class="status-line">Searching Open Food Facts…</div>`;
    if(ap.webStatus==='error') return `<div class="status-line err">Open Food Facts unavailable right now. <button type="button" class="link-btn" id="ap-web-retry">Retry</button></div>`;
    if(ap.webResults.length){
      return `<div class="status-line" style="margin-top:6px;">Open Food Facts (${ap.webResults.length})</div>` +
        ap.webResults.map((f,i)=>`<button type="button" class="result-row" style="width:100%;background:none;border:none;text-align:left;" data-pick-web="${i}">
          <span><span class="result-name">${Utils.esc(f.name)}</span><br><span class="result-meta">${Utils.roundInt(f.per100.cal)} kcal / 100g <span class="tag web">WEB</span></span></span>
        </button>`).join('');
    }
    return `<div class="status-line">No Open Food Facts matches for "${Utils.esc(q)}".</div>`;
  }
  return `<button type="button" class="btn secondary" id="ap-web-search" style="margin-top:4px;">Search Open Food Facts for "${Utils.esc(q)}"</button>`;
}

function renderBarcodeBlock(){
  const ap=State.addPanel;
  return `
    <div class="field" style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px;">
      <label>Or scan/enter a barcode (Open Food Facts)</label>
      <div style="display:flex;gap:6px;">
        <input type="text" inputmode="numeric" id="ap-barcode" placeholder="e.g. 3017620422003" value="${Utils.esc(ap.barcode)}"/>
        <button type="button" class="btn secondary" id="ap-barcode-go">Look up</button>
      </div>
      <div class="row2" style="margin-top:6px;">
        <button type="button" class="btn accent" id="ap-barcode-scan">📷 Scan with camera</button>
        <button type="button" class="btn secondary" id="ap-barcode-photo-btn">📸 Take a photo instead</button>
      </div>
      <input type="file" accept="image/*" capture="environment" id="ap-barcode-photo-input" style="display:none;"/>
      <div class="status-line" style="padding-top:4px;">Camera scan needs this page loaded over https:// (or a local server) — it won't work when the file is opened directly from disk in most browsers.</div>
      ${ap.barcodeStatus==='loading' ? `<div class="status-line">Looking up barcode…</div>` : ''}
      ${ap.barcodeStatus==='photo-decoding' ? `<div class="status-line">Reading barcode from photo…</div>` : ''}
      ${ap.barcodeStatus==='photo-nobarcode' ? `<div class="status-line err">Couldn't find a barcode in that photo — try again with better lighting and the barcode filling more of the frame.</div>` : ''}
      ${ap.barcodeStatus==='notfound' ? `<div class="status-line err">No product found for that barcode.</div>` : ''}
      ${ap.barcodeStatus==='error' ? `<div class="status-line err">Open Food Facts unavailable right now.</div>` : ''}
    </div>`;
}

function renderAddPanel(){
  const ap=State.addPanel;
  const mode=ap.mode;
  let body='';
  if(mode==='search'){
    const results = ap.query.trim() ? FoodDB.search(ap.query, 8) : [];
    body = `
      <div class="field"><input type="search" id="ap-search" placeholder="Search foods (e.g. chicken breast)" value="${Utils.esc(ap.query)}" autocomplete="off"/></div>
      ${ap.selected ? renderSelectedFoodRow(ap.selected) : `
        ${results.length ? results.map(f=>`<button type="button" class="result-row" style="width:100%;background:none;border:none;text-align:left;" data-pick-food="${Utils.esc(f.name)}">
            <span><span class="result-name">${Utils.esc(f.name)}</span><br><span class="result-meta">${f.per100.cal} kcal / 100g <span class="tag db">DB</span></span></span>
          </button>`).join('')
        : (ap.query.trim() ? '' : renderRecentFoods())
        }
        ${renderWebFoodBlock()}
        ${renderBarcodeBlock()}
      `}
    `;
  } else if(mode==='manual'){
    const m=ap.manual;
    body = `
      <div class="field"><label>Food name</label><input type="text" id="ap-mname" value="${Utils.esc(m.name)}" placeholder="e.g. Homemade smoothie"/></div>
      <div class="row2">
        <div class="field"><label>Calories</label><input type="number" id="ap-mcal" min="0" value="${Utils.esc(m.calories)}"/></div>
        <div class="field"><label>Protein (g)</label><input type="number" id="ap-mprotein" min="0" value="${Utils.esc(m.protein)}"/></div>
      </div>
      <div class="row2">
        <div class="field"><label>Carbs (g)</label><input type="number" id="ap-mcarbs" min="0" value="${Utils.esc(m.carbs)}"/></div>
        <div class="field"><label>Fat (g)</label><input type="number" id="ap-mfat" min="0" value="${Utils.esc(m.fat)}"/></div>
      </div>
      <button class="btn accent" id="ap-manual-add">Add to log</button>
    `;
  } else {
    body = renderSavedMealsBody();
  }
  return `
  <div class="add-panel">
    <div class="subtabs">
      <button data-apmode="search" class="${mode==='search'?'active':''}">Search database</button>
      <button data-apmode="manual" class="${mode==='manual'?'active':''}">Manual entry</button>
      <button data-apmode="saved" class="${mode==='saved'?'active':''}">Saved meals</button>
    </div>
    ${body}
  </div>`;
}

function renderRecentFoods(){
  const recent=State.recentFoods||[];
  const hint=`<div class="status-line">Start typing to search 300+ common foods, or millions more via Open Food Facts below.</div>`;
  if(!recent.length) return hint;
  return `<div class="status-line" style="padding-bottom:2px;">Recent &amp; frequent — tap + to log again</div>` +
    recent.map((e,i)=>`
    <div class="result-row">
      <div>
        <div class="result-name">${Utils.esc(e.name)}</div>
        <div class="result-meta">${Utils.esc(e.quantity+' '+e.unit)} · ${Utils.roundInt(e.calories)} kcal · P${Utils.roundInt(e.protein)} C${Utils.roundInt(e.carbs)} F${Utils.roundInt(e.fat)}${e.count>1?` · logged ${e.count}×`:''}</div>
      </div>
      <button class="add-chip" data-quick-add="${i}" title="Log again">+</button>
    </div>`).join('') + hint;
}

function renderSavedMealsBody(){
  const meals=State.savedMeals||[];
  if(!meals.length) return `<div class="status-line">No saved meals yet — log a meal normally, then tap "💾 Save as meal" under it to reuse it here in one tap next time.</div>`;
  return meals.map(m=>{
    const totals=m.items.reduce((acc,i)=>({
      calories:acc.calories+i.calories, protein:acc.protein+i.protein, carbs:acc.carbs+i.carbs, fat:acc.fat+i.fat
    }),{calories:0,protein:0,carbs:0,fat:0});
    return `
    <div class="result-row">
      <div>
        <div class="result-name">${Utils.esc(m.name)}</div>
        <div class="result-meta">${Utils.roundInt(totals.calories)} kcal · P${Utils.roundInt(totals.protein)} C${Utils.roundInt(totals.carbs)} F${Utils.roundInt(totals.fat)} · ${m.items.length} item${m.items.length===1?'':'s'}</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;">
        <button class="btn accent" data-use-saved-meal="${m.id}">Add</button>
        <button class="del" data-del-saved-meal="${m.id}" title="Delete saved meal">×</button>
      </div>
    </div>`;
  }).join('');
}

function renderSelectedFoodRow(sel){
  const food=State.addPanel.pickedFood;
  if(!food) return '';
  const m=FoodDB.macrosFor(food, sel.qty, sel.unit);
  const tagClass = food.source==='web' ? 'web' : 'db';
  const tagLabel = food.source==='web' ? 'WEB' : 'DB';
  const massUnit = food.isLiquid ? 'ml' : 'g';
  const opts=unitOptionsFor(food);
  const servingHint = (sel.unit==='serving' && food.servingLabel)
    ? `<div class="result-meta" style="margin-top:2px;">1 portion = ${Utils.esc(food.servingLabel)}</div>` : '';
  return `
    <div class="result-row">
      <div><div class="result-name">${Utils.esc(food.name)} <span class="tag ${tagClass}">${tagLabel}</span></div><div class="result-meta">${m.calories} kcal · P${m.protein} C${m.carbs} F${m.fat} (${m.grams}${massUnit})</div>${servingHint}</div>
      <div style="display:flex;gap:6px;align-items:center;">
        <input type="number" class="qty-input" id="ap-qty" min="0" step="0.5" value="${Utils.esc(sel.qty)}"/>
        <select id="ap-unit">${opts.map(u=>`<option value="${u}" ${sel.unit===u?'selected':''}>${u==='serving'?'portion':u}</option>`).join('')}</select>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button class="btn accent" id="ap-confirm-add">Add to log</button>
      <button class="btn secondary" id="ap-clear-select">Choose different food</button>
    </div>
  `;
}

/* =========================================================
   WORKOUT TAB
   ========================================================= */
function renderExerciseSuggestions(){
  const wi=State.workoutInput;
  const q=(wi.exerciseName||'').trim();
  if(!q) return '';
  if(!wi.suggestions.length){
    return `<div class="ex-suggest"><div class="ex-suggest-row" style="cursor:default;">
      <span class="fn">No match for “${Utils.esc(q)}”</span>
      <span class="fm">Tap Add to log it as a custom exercise${State.exerciseSync.status==='syncing'?' · library still loading…':''}</span></div></div>`;
  }
  return `<div class="ex-suggest">${wi.suggestions.map((s,i)=>`
    <button type="button" class="ex-suggest-row" data-pick-ex-idx="${i}">
      <span class="fn">${Utils.esc(s.name)}</span>
      <span class="fm">${Utils.esc([s.category, (s.equipment||[]).join(', ')].filter(Boolean).join(' · '))}</span>
    </button>`).join('')}</div>`;
}

function renderExerciseSyncStatus(){
  const s=State.exerciseSync;
  if(s.status==='syncing') return `Syncing exercise library… ${s.count} loaded so far.`;
  if(s.status==='error') return `Couldn't sync the exercise library. <button type="button" class="link-btn" id="ex-sync-btn">Retry</button>`;
  if(s.status==='done') return `Exercise library: ${s.count} exercises (wger, free) <button type="button" class="link-btn" id="ex-sync-btn">Resync</button>`;
  return `<button type="button" class="link-btn" id="ex-sync-btn">Sync free exercise library (900+, via wger)</button>`;
}

function renderWorkoutTab(dateKey, workout){
  const cat=State.workoutInput.category||'strength';
  return `
    <div class="datebar">
      <div class="dnav">
        <button class="navbtn" id="date-prev">←</button>
        <div class="dlabel">${Utils.esc(Utils.prettyDate(State.currentDate))}</div>
        <button class="navbtn" id="date-next">→</button>
      </div>
      ${Utils.dateKey(State.currentDate)!==Utils.dateKey(new Date()) ? `<button class="today-pill" id="date-today">Jump to today</button>` : ''}
    </div>

    <div class="grid two">
      <div class="card">
        <div class="card-head"><div><p class="card-title">Today's workout</p><p class="card-sub">${workout.entries.length} exercise${workout.entries.length===1?'':'s'} logged</p></div></div>
        <div class="seg" id="wk-category" style="margin-bottom:10px;">
          <button type="button" data-cat="strength" class="${cat==='strength'?'active':''}">Strength</button>
          <button type="button" data-cat="cardio" class="${cat==='cardio'?'active':''}">Cardio</button>
        </div>
        ${cat==='cardio' ? `<div class="water-btns" style="margin-bottom:10px;">
          ${['Run','Walk','Bike','Cardio'].map(l=>`<button type="button" class="chip-btn" data-cardio-preset="${l}">${l}</button>`).join('')}
        </div>` : ''}
        <div class="status-line" id="ex-sync-status" style="padding-top:0;">${renderExerciseSyncStatus()}</div>
        <div class="quicklog" style="position:relative;">
          <input type="search" id="wk-exname" autocomplete="off" enterkeyhint="done" placeholder="${cat==='cardio'?'Search or add cardio (e.g. Run)':'Search or add exercise (e.g. Bench Press)'}" value="${Utils.esc(State.workoutInput.exerciseName)}"/>
          <button class="btn accent" id="wk-add-exercise">Add</button>
          <div id="ex-suggest-box">${renderExerciseSuggestions()}</div>
        </div>
        <div class="exlist" id="wk-exlist">
          ${workout.entries.length ? workout.entries.map(ex=>renderExercise(ex)).join('') : `<div class="empty">No exercises logged for this day yet.</div>`}
        </div>
      </div>
      <div class="card">
        <div class="card-head"><div><p class="card-title">Personal records</p><p class="card-sub">Best lifts &amp; best paces on record</p></div></div>
        <div id="pr-list" class="pr-list"><div class="empty">Loading…</div></div>
      </div>
    </div>
  `;
}

function renderExercise(ex){
  const isCardio = ex.category==='cardio';
  const draft=State.setInputs[ex.id]||{}; // survives re-renders until the set is logged
  const unit=draft.weightUnit || State.settings.weightUnit || 'lb';
  const best = isCardio ? Calc.bestPaceSummary(ex.sets) : Calc.bestSetSummary(ex.sets);
  const bestLabel = isCardio
    ? (best ? ` · best pace ~${Calc.formatPace(best.durationSec,best.distanceKm)}` : '')
    : (best ? ` · best ~${Utils.roundInt(best.est)} ${best.weightUnit} e1RM` : '');
  return `
  <div class="exercise" data-exercise-id="${ex.id}" data-category="${isCardio?'cardio':'strength'}">
    <div class="exercise-head">
      <div><div class="en">${Utils.esc(ex.exerciseName)}</div><div class="em">${ex.sets.length} ${isCardio?(ex.sets.length===1?'session':'sessions'):(ex.sets.length===1?'set':'sets')}${bestLabel}<span class="cmp" id="cmp-${ex.id}"></span></div>${isCardio?'':`<div class="ex-suggestion" id="sugg-${ex.id}"></div>`}</div>
      <button class="del" data-del-exercise="${ex.id}" title="Remove exercise">×</button>
    </div>
    <div class="sets">
      ${ex.sets.map((s,i)=> isCardio ? `
        <div class="setrow">
          <span class="sn">${i+1}</span>
          <span class="sd">${s.distanceKm!=null?Utils.round(s.distanceKm,2)+' km':''}${s.durationSec!=null?` in ${Calc.formatDuration(s.durationSec)}`:''}${(s.distanceKm&&s.durationSec)?` · ${Calc.formatPace(s.durationSec,s.distanceKm)}`:''}</span>
          <button class="del" data-del-set="${ex.id}|${s.id}">×</button>
        </div>` : `
        <div class="setrow">
          <span class="sn">${i+1}</span>
          <span class="sd">${s.reps!=null?`${s.reps} reps`:''}${s.weight!=null?` @ ${s.weight}${s.weightUnit||'lb'}`:''}</span>
          <button class="del" data-del-set="${ex.id}|${s.id}">×</button>
        </div>`).join('')}
    </div>
    ${isCardio ? `
    <div class="addset-row">
      <input type="number" min="0" step="0.01" placeholder="Distance (km)" class="setinput" data-field="distance" data-exid="${ex.id}" value="${Utils.esc(draft.distance||'')}"/>
      <input type="number" min="0" step="0.5" placeholder="Time (min)" class="setinput" data-field="duration" data-exid="${ex.id}" value="${Utils.esc(draft.duration||'')}"/>
      <button class="btn secondary" data-add-set="${ex.id}">+ Log</button>
    </div>` : `
    <div class="addset-row">
      <input type="number" min="1" placeholder="Reps" class="setinput" data-field="reps" data-exid="${ex.id}" value="${Utils.esc(draft.reps||'')}"/>
      <input type="number" min="0" step="0.5" placeholder="Weight" class="setinput" data-field="weight" data-exid="${ex.id}" value="${Utils.esc(draft.weight||'')}"/>
      <select class="setinput" data-field="weightUnit" data-exid="${ex.id}" style="max-width:70px;">
        ${['lb','kg'].map(u=>`<option value="${u}" ${unit===u?'selected':''}>${u}</option>`).join('')}
      </select>
      <button class="btn secondary" data-add-set="${ex.id}">+ Set</button>
    </div>`}
  </div>`;
}

async function computeAllPRs(){
  const keys=await Store.list('workout:');
  const prMap={};
  for(const key of keys){
    const w=sanitizeWorkout(await Store.get(key, {entries:[]}));
    w.entries.forEach(ex=>{
      if(ex.category==='cardio'){
        const best=Calc.bestPaceSummary(ex.sets);
        if(best){
          const cur=prMap[ex.exerciseName];
          if(!cur || cur.type!=='pace' || best.pace<cur.pace) prMap[ex.exerciseName]={type:'pace', ...best};
        }
      } else {
        const best=Calc.bestSetSummary(ex.sets);
        if(best){
          const cur=prMap[ex.exerciseName];
          if(!cur || cur.type!=='strength' || best.estKg>cur.estKg) prMap[ex.exerciseName]={type:'strength', ...best};
        }
      }
    });
  }
  return Object.keys(prMap).sort().map(name=>({name, ...prMap[name]}));
}

async function renderPRListInto(container){
  const prs=await computeAllPRs();
  container.innerHTML = prs.length
    ? prs.map(p=> p.type==='pace'
        ? `<div class="pr-row"><span class="pn">${Utils.esc(p.name)}</span><span class="pv">${Utils.round(p.distanceKm,2)} km · ${Calc.formatPace(p.durationSec,p.distanceKm)}</span></div>`
        : `<div class="pr-row"><span class="pn">${Utils.esc(p.name)}</span><span class="pv">${p.weight}${p.weightUnit} × ${p.reps} (~${Utils.roundInt(p.est)}${p.weightUnit} e1RM)</span></div>`
      ).join('')
    : `<div class="empty">Log a few sets or cardio sessions to see PRs here.</div>`;
}

/* =========================================================
   SESSION-OVER-SESSION COMPARISON — "+50% vs last time" badges
   ========================================================= */
async function computePreviousVolumes(beforeDateKey){
  const keys=await Store.list('workout:');
  const prevMap={};
  for(const key of keys){
    const dk=key.slice('workout:'.length);
    if(!Utils.isValidDateKey(dk) || dk>=beforeDateKey) continue;
    const w=sanitizeWorkout(await Store.get(key, {entries:[]}));
    w.entries.forEach(ex=>{
      const info=Calc.volumeInfo(ex.sets);
      if(!info) return;
      const cur=prevMap[ex.exerciseName];
      if(!cur || dk>cur.dateKey) prevMap[ex.exerciseName]={dateKey:dk, value:info.value, type:info.type};
    });
  }
  return prevMap;
}

async function renderComparisonsInto(dateKey, entries){
  if(!entries || !entries.length) return;
  const prevMap=await computePreviousVolumes(dateKey);
  entries.forEach(ex=>{
    const el=document.getElementById('cmp-'+ex.id);
    if(!el) return;
    const info=Calc.volumeInfo(ex.sets);
    const prev=prevMap[ex.exerciseName];
    if(!info || !prev || prev.type!==info.type || !prev.value){ el.textContent=''; return; }
    const pct=((info.value-prev.value)/prev.value)*100;
    if(!isFinite(pct)){ el.textContent=''; return; }
    const label = info.type==='distance' ? 'distance' : 'volume';
    const arrow = pct>=0 ? '▲' : '▼';
    el.textContent = ` · ${arrow} ${Math.abs(Math.round(pct))}% ${label} vs ${Utils.prettyDate(Utils.parseDateKey(prev.dateKey))}`;
    el.style.color = pct>=0 ? 'var(--success)' : 'var(--danger)';
  });
}

/* =========================================================
   PROGRESSIVE OVERLOAD SUGGESTIONS — "try 62.5lb x 8 (last: 60lb x 8)"
   using a simple, standard double-progression heuristic: once you
   reach the top of a rep range, add weight and drop back down in
   reps; otherwise, just add one more rep at the same weight.
   ========================================================= */
async function computeLastSessionBests(beforeDateKey){
  const keys=await Store.list('workout:');
  const prevMap={};
  for(const key of keys){
    const dk=key.slice('workout:'.length);
    if(!Utils.isValidDateKey(dk) || dk>=beforeDateKey) continue;
    const w=sanitizeWorkout(await Store.get(key, {entries:[]}));
    w.entries.forEach(ex=>{
      if(ex.category==='cardio') return;
      const best=Calc.bestSetSummary(ex.sets);
      if(!best) return;
      const cur=prevMap[ex.exerciseName];
      if(!cur || dk>cur.dateKey) prevMap[ex.exerciseName]={dateKey:dk, ...best};
    });
  }
  return prevMap;
}

function suggestNextTarget(prevBest){
  if(!prevBest || !prevBest.weight || !prevBest.reps) return null;
  const unit=prevBest.weightUnit||'lb';
  const increment = unit==='kg' ? 2.5 : 5;
  const REP_CAP=10; // hit this many reps on the top set -> time to add weight
  if(prevBest.reps>=REP_CAP){
    return { weight:Utils.round(prevBest.weight+increment,1), reps:Math.max(6,prevBest.reps-2), weightUnit:unit, basis:prevBest };
  }
  return { weight:prevBest.weight, reps:prevBest.reps+1, weightUnit:unit, basis:prevBest };
}

async function renderSuggestionsInto(dateKey, entries){
  if(!entries || !entries.length) return;
  const prevMap=await computeLastSessionBests(dateKey);
  entries.forEach(ex=>{
    if(ex.category==='cardio') return;
    const el=document.getElementById('sugg-'+ex.id);
    if(!el) return;
    const sugg=suggestNextTarget(prevMap[ex.exerciseName]);
    el.textContent = sugg ? `💡 Try ${sugg.weight}${sugg.weightUnit} × ${sugg.reps} (last: ${sugg.basis.weight}${sugg.basis.weightUnit} × ${sugg.basis.reps})` : '';
  });
}

/* =========================================================
   PROGRESS TAB — weight & body-fat tracking with trend charts
   ========================================================= */
// Trailing moving average over the last `window` logged points (index-based,
// not calendar-based — since weight/bodyfat get at most one entry per day,
// "last N logged entries" is a reasonable stand-in for "last N days" even
// when there are gaps). Smooths out day-to-day noise like water retention.
function movingAverage(points, window){
  return points.map((p,i)=>{
    const slice=points.slice(Math.max(0,i-window+1), i+1);
    return { date:p.date, value: slice.reduce((s,q)=>s+q.value,0)/slice.length };
  });
}

function trendChartSvg(points, color, avgPoints){
  // points: [{date:Date, value:number}], already filtered to non-null values, ascending by date
  const w=560, h=140, padX=14, padY=16;
  if(points.length===0){
    return `<div class="empty">Log an entry to start your trend.</div>`;
  }
  if(points.length===1){
    return `<div class="empty">Log one more entry to see a trend line.</div>`;
  }
  const values=points.map(p=>p.value);
  let min=Math.min(...values), max=Math.max(...values);
  if(min===max){ min-=1; max+=1; }
  const range=max-min;
  const stepX=(w-2*padX)/(points.length-1);
  const coords=points.map((p,i)=>({
    x: padX+stepX*i,
    y: padY+(h-2*padY)*(1-(p.value-min)/range)
  }));
  const linePath=coords.map((c,i)=>(i===0?'M':'L')+c.x.toFixed(1)+' '+c.y.toFixed(1)).join(' ');
  const areaPath=linePath+` L ${coords[coords.length-1].x.toFixed(1)} ${(h-padY).toFixed(1)} L ${coords[0].x.toFixed(1)} ${(h-padY).toFixed(1)} Z`;
  const dots=coords.map((c,i)=>`<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="${i===coords.length-1?4.5:2.5}" fill="${color}"/>`).join('');
  const fmt=d=>d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  const showAvg = avgPoints && avgPoints.length===points.length && points.length>=4;
  const avgLine = showAvg ? (()=>{
    const avgCoords=avgPoints.map((p,i)=>({ x: padX+stepX*i, y: padY+(h-2*padY)*(1-(p.value-min)/range) }));
    const path=avgCoords.map((c,i)=>(i===0?'M':'L')+c.x.toFixed(1)+' '+c.y.toFixed(1)).join(' ');
    return `<path d="${path}" fill="none" stroke="${color}" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.55"/>`;
  })() : '';
  return `
    <svg class="trend-chart" viewBox="0 0 ${w} ${h}" width="100%" height="140" preserveAspectRatio="none">
      <path d="${areaPath}" fill="${color}" opacity="0.10" stroke="none"/>
      ${avgLine}
      <path d="${linePath}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
    </svg>
    <div class="trend-dates"><span>${fmt(points[0].date)}</span><span>${showAvg?'— actual  ⋯ 7-entry avg':''}</span><span>${fmt(points[points.length-1].date)}</span></div>
  `;
}

function statCard(label, unit, points, color, decimals){
  const has=points.length>0;
  const last=has?points[points.length-1].value:null;
  const first=has?points[0].value:null;
  const delta=has && points.length>1 ? last-first : 0;
  const deltaClass = delta<0 ? 'down' : delta>0 ? 'up' : '';
  const deltaStr = has && points.length>1
    ? `${delta>0?'+':''}${Utils.round(delta,decimals)}${unit} since first log`
    : 'Log a second entry to see a trend';
  return `
    <div class="stat-card">
      <div class="slabel">${label}</div>
      <div class="sval">${has?Utils.round(last,decimals)+unit:'—'}</div>
      <div class="sdelta ${deltaClass}">${deltaStr}</div>
    </div>`;
}

// Compares the current 7-entry rolling average to what it was 7 entries ago —
// a much steadier "are you actually trending up/down" signal than the raw
// day-to-day number, which bounces around with water weight/food in the gut.
function avgTrendLabel(avgPoints, unit, decimals){
  if(avgPoints.length<8) return '';
  const cur=avgPoints[avgPoints.length-1].value;
  const prev=avgPoints[avgPoints.length-8].value;
  const delta=cur-prev;
  return `7-entry avg: ${Utils.round(cur,decimals)}${unit} (${delta>0?'+':''}${Utils.round(delta,decimals)}${unit} vs a week of entries ago)`;
}

function renderAdaptiveCard(){
  const a=State.adaptive;
  if(!a) return '';
  const goal=State.profile.goals.calories;
  const goalLabel=(Calc.GOALTYPES.find(g=>g.id===State.profile.goalType)||{}).label||'your goal';
  if(!a.ready){
    return `
    <div class="card" style="margin-bottom:16px;">
      <div class="card-head"><div><p class="card-title">Adaptive maintenance</p>
        <p class="card-sub">Learns your real maintenance calories from your logs — like MacroFactor, for free.</p></div></div>
      <div class="status-line">Needs a bit more data from the last 4 weeks:
        <strong>${Math.min(a.loggedDays,7)}/7</strong> days of food logged ·
        <strong>${Math.min(a.weighIns,3)}/3</strong> weigh-ins ·
        weigh-ins spanning <strong>${Math.min(Math.round(a.span||0),10)}/10</strong> days.
        Until then your target uses the standard formula (~${Utils.roundInt(a.formula)} kcal maintenance).</div>
    </div>`;
  }
  const suggested=Calc.goalsFromTDEE({ ...State.profile, weightKg:a.latestWeight }, a.tdee).calories;

  return `
  <div class="card" style="margin-bottom:16px;">
    <div class="card-head"><div><p class="card-title">Adaptive maintenance</p>
      <p class="card-sub">Avg intake ${Utils.roundInt(a.avgIntake)} kcal · weight trend ${trend>0?'+':''}${trend} kg/week · ${a.loggedDays} days logged · confidence ${Utils.roundInt(a.confidence*100)}%</p></div></div>
    <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;">
      <span class="ring-num">${Utils.roundInt(a.tdee)}</span><span class="card-sub">kcal/day real maintenance</span>
      <span class="card-sub">(formula said ~${Utils.roundInt(a.formula)})</span>
    </div>
    ${Math.abs(diff)>=50 ? `
      <div class="status-line" style="margin-top:6px;">For <strong>${Utils.esc(goalLabel)}</strong> your target should be <strong>${suggested} kcal</strong> (currently ${goal}, ${diff>0?'+':''}${diff}).</div>
      <button class="btn accent" id="adaptive-apply" style="margin-top:4px;">Update my target to ${suggested} kcal</button>`
    : `<div class="status-line" style="margin-top:6px;">Your current target (${goal} kcal) already matches — no change needed.</div>`}
  </div>`;
}

function renderProgressTab(weightHistory){
  const draft=State.progressDraft;
  const todayKey=Utils.dateKey(new Date());
  const existingToday=weightHistory.find(e=>e.date===todayKey);

  const weightPoints=weightHistory.filter(e=>e.weightKg!=null).map(e=>({date:Utils.parseDateKey(e.date), value:e.weightKg}));
  const fatPoints=weightHistory.filter(e=>e.bodyFatPct!=null).map(e=>({date:Utils.parseDateKey(e.date), value:e.bodyFatPct}));

  const fatAvgPoints=movingAverage(fatPoints,7);

  const recent=weightHistory.slice().sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:0).slice(0,14);

  return `
    ${renderAdaptiveCard()}
    <div class="grid two">
      <div class="card">
        <div class="card-head">

            </div>

        </div>

    <div class="grid two" style="margin-top:16px;">
      <div class="card">
        <div class="card-head"><div><p class="card-title">Weight trend</p><p class="card-sub">${avgTrendLabel(weightAvgPoints,' kg',1) || 'All logged entries'}</p></div></div>
        ${trendChartSvg(weightPoints, 'var(--accent)', weightAvgPoints)}
      </div>
      <div class="card">
        <div class="card-head"><div><p class="card-title">Body fat trend</p><p class="card-sub">${avgTrendLabel(fatAvgPoints,'%',1) || 'All logged entries'}</p></div></div>
        ${trendChartSvg(fatPoints, 'var(--accent2)', fatAvgPoints)}
      </div>
    </div>

    <div class="card" style="margin-top:16px;">
      <div class="card-head"><div><p class="card-title">History</p><p class="card-sub">Most recent entries</p></div></div>
      <div class="history-list">
        ${recent.length ? recent.map(e=>`
          <div class="history-row">
            <span class="hdate">${Utils.esc(Utils.prettyDate(Utils.parseDateKey(e.date)))}</span>
            <span class="hvals">${e.weightKg!=null?Utils.round(e.weightKg,1)+' kg':'—'}${e.bodyFatPct!=null?` <span>· ${Utils.round(e.bodyFatPct,1)}% BF</span>`:''}</span>
            <button class="del" data-del-weight="${e.id}" title="Remove">×</button>
          </div>`).join('')
          : `<div class="empty">No entries yet — log your weight above to start tracking.</div>`}
      </div>
    </div>
  `;
}

    {q:"J'ai mal aux genoux/dos pendant les squats, que faire ?", kw:["douleur genou squat","mal au dos squat","douleur articulaire musculation"],

    {q:"Comment calculer mes calories de maintien ?", kw:["calories de maintien","tdee","combien de calories par jour"],
      a:"Ton TDEE (dépense énergétique totale) = ton métabolisme de base (BMR) x ton niveau d'activité. C'est justement ce que l'app calcule pour toi dans ton profil — regarde tes objectifs caloriques dans l'onglet Progress/Setup, basés sur ton poids, taille, âge et niveau d'activité."},

    {q:"Les BCAA sont-ils utiles ?", kw:["bcaa","acides amines branches"],

    {q:"Quels suppléments sont vraiment utiles pour débuter ?", kw:["supplements debutant","quels supplements prendre"],

    {q:"La musculation fait-elle grossir/prendre du volume chez les femmes ?", kw:["femme musculation volume","femme prendre du muscle"],
      a:"Prendre beaucoup de volume musculaire demande du temps et un surplus calorique soutenu — ça n'arrive pas 'par accident' en s'entraînant normalement. La musculation aide plutôt à tonifier, renforcer les os et améliorer la composition corporelle, sans les niveaux de testostérone nécessaires pour un gain de masse important."},
    {q:"Est-ce sûr de faire de la musculation en tant que senior ?", kw:["musculation senior","personne agee musculation","musculation apres 60 ans"],
      a:"Oui, et c'est même très recommandé : la musculation aide à préserver la masse musculaire, la densité osseuse et l'équilibre avec l'âge. Commence progressivement, avec une bonne technique, et n'hésite pas à consulter un professionnel de santé avant de démarrer si tu as des conditions médicales."},
    {q:"Est-ce dangereux de perdre du poids trop vite ?", kw:["perte de poids trop rapide","maigrir trop vite","danger perte de poids"],
      a:"Perdre plus de 1% de ton poids de corps par semaine sur le long terme augmente le risque de perte musculaire, de fatigue et de reprise de poids ('effet yoyo'). Vise plutôt 0.5-1% de ton poids par semaine pour une perte durable. Pour toute perte de poids importante ou rapide, un avis médical est recommandé."},
    {q:"Comment reprendre l'entraînement après une petite blessure ?", kw:["reprise apres blessure","blessure musculation","recommencer apres blessure"],
      a:"Reprends progressivement, avec des charges réduites, et évite les mouvements qui reproduisent la douleur. Si la douleur persiste ou s'aggrave, consulte un professionnel de santé (médecin, physio) avant de continuer — je ne suis pas un professionnel médical."},
    {q:"Qu'est-ce que le régime cétogène (keto) ?", kw:["regime keto","cetogene","low carb"],
      a:"Le régime cétogène est très pauvre en glucides (souvent <50g/jour) et riche en graisses, ce qui met le corps en cétose. Il peut aider à perdre du poids en réduisant naturellement l'appétit chez certaines personnes, mais il n'est pas magique — un déficit calorique reste nécessaire, et ce n'est pas adapté à tout le monde (notamment pour la performance en musculation intense)."},
    {q:"Combien de cardio par semaine pour la santé ?", kw:["combien de cardio par semaine","cardio recommandation"],
      a:"Les recommandations générales sont d'environ 150 minutes de cardio modéré (ou 75 minutes intense) par semaine pour la santé cardiovasculaire. Plus si ton objectif est spécifiquement la perte de gras ou la performance en endurance."},
    {q:"Vaut-il mieux s'entraîner le matin ou le soir ?", kw:["musculation matin ou soir","meilleur moment pour s'entrainer"],
      a:"Le meilleur moment est celui où tu es le plus régulier et où tu as le plus d'énergie — il n'y a pas de moment 'magique' scientifiquement supérieur pour la majorité des gens. La constance sur la durée compte bien plus que l'heure de la séance."},
    {q:"Quels sont les signes de surentraînement (overtraining) ?", kw:["surentrainement","overtraining","trop s'entrainer"],
      a:"Fatigue persistante, baisse de performance malgré le repos, sommeil perturbé, irritabilité, blessures/douleurs qui traînent, et perte de motivation sont des signes classiques. Si tu les reconnais, prends une semaine de décharge (volume/intensité réduits) et priorise le sommeil et la nutrition."},
    {q:"Comment créer un déficit calorique sans avoir constamment faim ?", kw:["deficit sans faim","perdre du poids sans avoir faim"],
      a:"Privilégie les aliments riches en protéines et en fibres (légumes, légumineuses, viandes maigres) qui rassasient plus par calorie. Bois de l'eau avant les repas, mange lentement, et évite un déficit trop agressif — un déficit modéré (300-500 kcal) est bien plus facile à tenir sans faim constante."},
    {q:"Peut-on prendre du muscle et perdre du gras en même temps (recomposition corporelle) ?", kw:["recomposition corporelle","prendre du muscle et perdre du gras en meme temps"],
      a:"Oui, c'est possible surtout pour les débutants, les personnes en surpoids, ou celles qui reprennent l'entraînement après une pause — en mangeant autour de son maintien calorique, avec des protéines élevées et un bon programme de musculation. Pour les athlètes déjà avancés, c'est plus lent et limité."},
    {q:"Combien de temps avant l'entraînement faut-il manger ?", kw:["manger avant entrainement","repas avant seance","combien de temps avant sport manger"],
      a:"Un repas complet 2-3h avant l'entraînement est idéal pour digérer sans inconfort. Si tu manques de temps, une petite collation (banane, une poignée de fruits secs) 30-60 minutes avant peut suffire pour l'énergie."}
  ];

  function normalize(s){
    return (s||'').toString().toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g,'')
      .replace(/[^a-z0-9\s]/g,' ')
      .replace(/\s+/g,' ').trim();
  }

  function scoreItem(qNorm, qTokens, item){
    let score=0;
    item.kw.forEach(kw=>{
      const kwNorm=normalize(kw);
      if(qNorm.includes(kwNorm)) score+=3;
      else{
        const overlap=kwNorm.split(' ').filter(t=>t.length>2 && qTokens.includes(t)).length;
        score+=overlap;
      }
    });
    return score;
  }

  // The FAQ is written in French but the app UI is English: map common English phrasings
  // onto the French keywords so English questions match too.
  const EN=[
    [/protein/, 'proteine'], [/whey|protein powder/, 'whey'],
    [/lose weight|weight loss|lose fat|fat loss|cutting|\bcut\b/, 'perdre du poids'],
    [/build muscle|gain muscle|bulk|gain mass|gain weight/, 'prise de masse'],
    [/cardio (or|vs) (weights|lifting|strength)/, 'cardio ou musculation'],
    [/how often|times a week|days a week|frequency/, 'combien de fois par semaine'],
    [/rest between|rest time/, 'repos entre series'], [/sore|doms/, 'courbatures'],
    [/creatine/, 'creatine'], [/water|hydrat/, 'combien eau'],
    [/intermittent fasting|fasting/, 'jeune intermittent'], [/plateau|stall|not losing/, 'plateau'],
    [/warm.?up/, 'echauffement'], [/stretch/, 'etirements'], [/at night|late night|eat late/, 'manger le soir'],
    [/glycemic/, 'index glycemique'], [/\babs\b|plank/, 'abdos tous les jours'],
    [/results|how long until|see progress/, 'voir des resultats'], [/vegan|vegetarian|plant protein/, 'proteine vegan'],
    [/alcohol|beer|wine/, 'alcool et musculation'], [/sleep/, 'sommeil recuperation'], [/fasted cardio/, 'cardio a jeun'],
    [/sets per week|training volume/, 'series par semaine'], [/full body|split|push pull/, 'full body ou split'],
    [/heavy or light|rep range|strength or hypertrophy/, 'reps lourdes ou legeres'],
    [/knee|back pain|joint pain/, 'douleur articulaire musculation'],
    [/maintenance calories|tdee|how many calories/, 'calories de maintien'],
    [/anabolic window|after (my )?workout|post.?workout/, 'fenetre anabolique'], [/bcaa/, 'bcaa'],
    [/supplement/, 'supplements debutant'], [/women|woman|bulky/, 'femme musculation volume'],
    [/senior|older|over 60/, 'musculation senior'], [/too fast/, 'perte de poids trop rapide'],
    [/injur/, 'reprise apres blessure'], [/keto|low carb/, 'regime keto'], [/how much cardio/, 'combien de cardio par semaine'],
    [/morning or evening|best time to (train|workout)/, 'musculation matin ou soir'], [/overtrain/, 'surentrainement'],
    [/hungry|hunger/, 'deficit sans faim'], [/recomp/, 'recomposition corporelle'], [/before (my )?workout|pre.?workout/, 'manger avant entrainement']
  ];

  function answer(query){
    const base=normalize(query);
    const qNorm=[base].concat(EN.filter(([re])=>re.test(base)).map(([,fr])=>fr)).join(' ');
    const qTokens=qNorm.split(' ').filter(Boolean);
    let best=null, bestScore=0;
    const scored=items.map(item=>({item, score:scoreItem(qNorm,qTokens,item)}));
    scored.sort((a,b)=>b.score-a.score);
    if(scored.length && scored[0].score>=2){
      best=scored[0].item; bestScore=scored[0].score;
    }
    if(best){
      return { matched:true, text:best.a, question:best.q };
    }
    const suggestions=scored.filter(s=>s.score>0).slice(0,3).map(s=>s.item.q);
    return { matched:false, suggestions };
  }

  return { answer, count: items.length };
})();

/* =========================================================
   FREE AI (OPTIONAL) — Google Gemini via a user-supplied free
   API key (from aistudio.google.com). If no key is configured,
   the Coach falls back to the offline FAQ database above, so
   the app stays fully functional and free either way.
   ========================================================= */
const GEMINI_MODEL='gemini-3.8-flash'; // Google renames/retires models periodically (2.0-flash was shut down) — update this if the Coach starts failing again
async function callGemini(apiKey, systemPrompt, history){
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(apiKey)}`;
  const contents=history.map(m=>({ role: m.role==='assistant'?'model':'user', parts:[{text:m.content}] }));
  const res=await fetch(url,{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ system_instruction:{ parts:[{text:systemPrompt}] }, contents })
  });
  if(!res.ok){
    let detail='';
    try{ const errBody=await res.json(); detail=(errBody && errBody.error && errBody.error.message) || ''; }catch(e){}
    const err=new Error('gemini-http-'+res.status+(detail?': '+detail:''));
    err.httpStatus=res.status;
    throw err;
  }
  const data=await res.json();
  const cand=data.candidates && data.candidates[0];
  const text=(cand && cand.content && cand.content.parts) ? cand.content.parts.map(p=>p.text||'').join('') : '';
  if(!text.trim()) throw new Error('gemini-empty-response');
  return text.trim();
}

// Lets the free (no-key) coach answer "how am I doing today?" from the user's own log —
// the FAQ alone can't, yet that's the example question the chat suggests.
async function todayStatusReply(text){
  const q=(text||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  if(!/(aujourd|today|on track|tracking|remaining|left today|me reste|reste.?t.?il|mon total|ou j.?en suis|how am i|where am i|objectif du jour|goals? today)/.test(q)) return null;
  const key=Utils.dateKey(new Date());
  const [entries, water]=await Promise.all([DayLog.get(key), WaterLog.get(key)]);
  const t=Calc.totals(entries), g=State.profile.goals;
  const left=Math.round(g.calories-t.calories);
  const pct=(v,goal)=>goal>0?Math.round(v/goal*100):0;
  return `Aujourd'hui : ${Math.round(t.calories)} / ${g.calories} kcal (${left>=0?`il te reste ${left} kcal`:`${-left} kcal au-dessus`}).\n`
    + `Protéines ${Math.round(t.protein)}/${g.protein} g (${pct(t.protein,g.protein)}%) · Glucides ${Math.round(t.carbs)}/${g.carbs} g · Lipides ${Math.round(t.fat)}/${g.fat} g · Eau ${(water.ml/1000).toFixed(1)}/${(g.waterMl/1000).toFixed(1)} L.`
    + (t.protein < g.protein*0.6 && entries.length ? `\nPriorise les protéines pour le reste de la journée.` : '');
}

async function sendChatMessage(text){
  text=(text||'').trim();
  if(!text || State.chat.sending) return;
  State.chat.messages.push({role:'user', content:text});
  State.chat.sending=true;
  await rerenderCoach();

  const apiKey=(State.settings.geminiApiKey||'').trim();

  try{
    if(apiKey){
      const dateKey=Utils.dateKey(State.currentDate);
      const [entries, water] = await Promise.all([DayLog.get(dateKey), WaterLog.get(dateKey)]);
      const totals=Calc.totals(entries);
      const goals=State.profile.goals;
      const sys = `You are a friendly, concise fitness & nutrition coach inside an app called PULSE. `
        + `User profile: ${JSON.stringify(State.profile)}. `
        + `Today's totals: ${JSON.stringify(totals)}. Water: ${water.ml}ml of ${goals.waterMl}ml goal. `
        + `Give short, practical, encouraging answers (a few sentences). Never claim to be a medical professional; `
        + `suggest consulting a doctor or dietitian for medical concerns.`;
      const history = State.chat.messages.slice(-10).map(m=>({role:m.role, content:m.content}));
      const reply = await callGemini(apiKey, sys, history);
      State.chat.messages.push({role:'assistant', content:reply});
    } else {
      // Free fallback: no external AI key configured — answer from the offline FAQ database.
      const result=FAQ.answer(text);
      let reply;
      const statusReply=await todayStatusReply(text);
      if(statusReply){
        reply=statusReply;
      } else if(result.matched){
        reply=result.text;
      } else if(result.suggestions.length){
        reply=`Je n'ai pas de réponse toute faite pour ça dans ma FAQ gratuite. Sujets proches : ${result.suggestions.join(' · ')}\n\nAjoute une clé Gemini gratuite ci-dessus pour des réponses libres sur n'importe quel sujet.`;
      } else {
        reply=`Je n'ai pas de réponse pour ça dans ma FAQ gratuite (${FAQ.count} sujets fitness/nutrition). Ajoute une clé Gemini gratuite ci-dessus (aistudio.google.com) pour des réponses libres sur n'importe quel sujet.`;
      }
      State.chat.messages.push({role:'assistant', content:reply});
    }
  }catch(err){
    console.error('Coach chat error', err);
    let msg="Something went wrong looking that up. Please try again.";
    if(apiKey){
      const status=err && err.httpStatus;
      const detail=((err && err.message)||'').toLowerCase();
      if(detail.includes('api key')) msg="Gemini rejected your API key — double check it was copied correctly (no extra spaces), or generate a fresh one at aistudio.google.com.";
      else if(detail.includes('model')) msg="Gemini rejected the model this app uses — Google renames/retires models periodically, so this app's Gemini model id likely needs updating.";
      else if(status===429) msg="You've hit Gemini's free-tier rate limit for now — wait a minute and try again.";
      else if(status===403) msg="Gemini refused this request (permission denied) — check that your API key is active at aistudio.google.com.";
      else msg="I couldn't reach Gemini just now. Please try again in a moment.";
    }
    State.chat.messages.push({role:'assistant', content:msg});
  }finally{
    State.chat.sending=false;
    await rerenderCoach();
  }
}

async function rerenderCoach(){
  if(State.activeTab!=='coach') return;
  const app=document.getElementById('app');
  const dateKey=Utils.dateKey(State.currentDate);
  const [entries, workout, water, weightHistory] = await Promise.all([DayLog.get(dateKey), WorkoutLog.get(dateKey), WaterLog.get(dateKey), WeightLog.getAll()]);
  const weekTotals=await getWeekCalories(State.currentDate);
  app.innerHTML = renderShell(dateKey, entries, workout, water, weekTotals, weightHistory);
  wireShell(dateKey, entries, workout, water, weightHistory);
  const body=document.getElementById('chat-body');
  if(body) body.scrollTop=body.scrollHeight;
}

/* =========================================================
   EVENT WIRING
   ========================================================= */
function wireShell(dateKey, entries, workout, water, weightHistory){
  document.querySelectorAll('nav.tabs button[data-tab]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      State.activeTab=btn.dataset.tab;
      State.addPanel.open=false;
      await render();
      if(State.activeTab==='workout'){
        const prEl=document.getElementById('pr-list');
        if(prEl) renderPRListInto(prEl);
      }
      if(State.activeTab==='coach'){
        const body=document.getElementById('chat-body');
        if(body) body.scrollTop=body.scrollHeight;
      }
    });
  });

  const resetBtn=document.getElementById('btn-reset');
  if(resetBtn) resetBtn.addEventListener('click', async ()=>{
    if(confirm('Edit your profile? This will take you back to setup (your logs are kept).')){
      Object.assign(setupDraft, State.profile);
      State.profile=null;
      await render();
    }
  });

  const prevBtn=document.getElementById('date-prev');
  if(prevBtn) prevBtn.addEventListener('click', async ()=>{ State.currentDate=Utils.addDays(State.currentDate,-1); State.addPanel.open=false; await render(); });
  const nextBtn=document.getElementById('date-next');
  if(nextBtn) nextBtn.addEventListener('click', async ()=>{ State.currentDate=Utils.addDays(State.currentDate,1); State.addPanel.open=false; await render(); });
  const todayBtn=document.getElementById('date-today');
  if(todayBtn) todayBtn.addEventListener('click', async ()=>{ State.currentDate=new Date(); State.addPanel.open=false; await render(); });

  if(State.activeTab==='today') wireTodayTab(dateKey, entries, water);
  if(State.activeTab==='workout'){ wireWorkoutTab(dateKey, workout); const prEl=document.getElementById('pr-list'); if(prEl) renderPRListInto(prEl); renderComparisonsInto(dateKey, workout.entries); renderSuggestionsInto(dateKey, workout.entries); }
  if(State.activeTab==='progress') wireProgressTab(weightHistory);
  if(State.activeTab==='coach') wireCoachTab();
}

function wireProgressTab(weightHistory){
  const wEl=document.getElementById('pg-weight');
  if(wEl) wEl.addEventListener('input', (e)=>{ State.progressDraft.weightKg=e.target.value; });
  const fEl=document.getElementById('pg-bodyfat');
  if(fEl) fEl.addEventListener('input', (e)=>{ State.progressDraft.bodyFatPct=e.target.value; });

  const saveBtn=document.getElementById('pg-save');
  if(saveBtn) saveBtn.addEventListener('click', async ()=>{
    const draft=State.progressDraft;
    const wBlank=draft.weightKg===''||draft.weightKg==null, fBlank=draft.bodyFatPct===''||draft.bodyFatPct==null;
    if(wBlank && fBlank){ showToast('Enter a weight or body fat % first'); return; }
    if(!wBlank && Utils.inRange(draft.weightKg,20,400)==null){ showToast('Weight must be between 20 and 400 kg'); return; }
    if(!fBlank && Utils.inRange(draft.bodyFatPct,2,70)==null){ showToast('Body fat must be between 2 and 70%'); return; }
    const todayKey=Utils.dateKey(new Date());
    await WeightLog.upsert(todayKey, draft.weightKg, draft.bodyFatPct);
    State.progressDraft={ weightKg:'', bodyFatPct:'' };
    showToast('Progress logged');
    await render();
  });

  document.querySelectorAll('[data-del-weight]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      await WeightLog.remove(btn.dataset.delWeight);
      showToast('Entry removed');
      await render();
    });
  });

  const applyBtn=document.getElementById('adaptive-apply');
  if(applyBtn) applyBtn.addEventListener('click', async ()=>{
    const a=State.adaptive;
    if(!a || !a.ready) return;
    const p={ ...State.profile, weightKg:Utils.round(a.latestWeight,1), adaptiveTDEE:Math.round(a.tdee) };
    p.goals=Calc.goalsFromTDEE(p, p.adaptiveTDEE);
    State.profile=await Profile.set(p);
    showToast(`Target updated to ${p.goals.calories} kcal`);
    await render();
  });
}

function wireTodayTab(dateKey, entries, water){
  document.querySelectorAll('[data-water]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const delta=Utils.num(btn.dataset.water);
      const newMl=Utils.clamp(water.ml+delta,0,15000);
      await WaterLog.set(dateKey, newMl);
      showToast(delta>0?`+${delta} ml logged`:`${delta} ml removed`);
      await render();
    });
  });

  document.querySelectorAll('[data-open-add]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const meal=btn.dataset.openAdd;
      if(State.addPanel.open && State.addPanel.meal===meal){
        State.addPanel.open=false;
      } else {
        State.addPanel={ open:true, meal, mode:'search', query:'', selected:null, pickedFood:null, qty:'1', unit:'serving',
                          manual:{name:'',calories:'',protein:'',carbs:'',fat:''},
                          webStatus:'idle', webResults:[], webQueriedFor:null, barcode:'', barcodeStatus:'idle' };
      }
      await render();
    });
  });

  document.querySelectorAll('[data-del-entry]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id=btn.dataset.delEntry;
      const updated=entries.filter(e=>e.id!==id);
      await DayLog.set(dateKey, updated);
      showToast('Removed from log');
      await render();
    });
  });

  document.querySelectorAll('[data-save-meal]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      State.saveMealDraft={ open:true, mealType:btn.dataset.saveMeal, name:'' };
      await render();
    });
  });

  const smd=State.saveMealDraft;
  if(smd.open){
    const nameEl=document.getElementById('savemeal-name');
    if(nameEl){
      nameEl.focus();
      nameEl.setSelectionRange(nameEl.value.length, nameEl.value.length);
      nameEl.addEventListener('input', (e)=>{ smd.name=e.target.value; });
      nameEl.addEventListener('keydown', (e)=>{ if(e.key==='Enter') document.getElementById('savemeal-confirm').click(); });
    }
    const cancelBtn=document.getElementById('savemeal-cancel');
    if(cancelBtn) cancelBtn.addEventListener('click', async ()=>{
      State.saveMealDraft={ open:false, mealType:null, name:'' };
      await render();
    });
    const confirmBtn=document.getElementById('savemeal-confirm');
    if(confirmBtn) confirmBtn.addEventListener('click', async ()=>{
      const name=smd.name.trim();
      if(!name){ showToast('Enter a name for this meal'); return; }
      const items=entries.filter(e=>e.mealType===smd.mealType).map(e=>({
        name:e.name, quantity:e.quantity, unit:e.unit, calories:e.calories, protein:e.protein, carbs:e.carbs, fat:e.fat,
        source:e.source, sourceLabel:e.sourceLabel
      }));
      const all=(await SavedMeals.getAll()).concat([{ id:Utils.uid('meal'), name, items, createdAt:Date.now() }]);
      State.savedMeals=await SavedMeals.set(all);
      State.saveMealDraft={ open:false, mealType:null, name:'' };
      showToast(`Saved "${name}"`);
      await render();
    });
  }

  wireAddPanel(dateKey, entries);
}

function wireAddPanel(dateKey, entries){
  const ap=State.addPanel;
  if(!ap.open) return;

  document.querySelectorAll('[data-apmode]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      ap.mode=btn.dataset.apmode; ap.selected=null; ap.pickedFood=null;
      await render();
    });
  });

  document.querySelectorAll('[data-use-saved-meal]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const meal=State.savedMeals.find(m=>m.id===btn.dataset.useSavedMeal);
      if(!meal) return;
      const newEntries=meal.items.map(item=>({ id:Utils.uid('food'), mealType:ap.meal, ...item }));
      const updated=entries.concat(newEntries);
      await DayLog.set(dateKey, updated);
      showToast(`Added "${meal.name}" (${meal.items.length} item${meal.items.length===1?'':'s'})`);
      State.addPanel.open=false;
      await render();
    });
  });

  document.querySelectorAll('[data-quick-add]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const src=(State.recentFoods||[])[Utils.num(btn.dataset.quickAdd)];
      if(!src) return;
      const { count, ...entry } = src;
      await DayLog.set(dateKey, entries.concat([{ ...entry, id:Utils.uid('food'), mealType:ap.meal }]));
      showToast(`Added ${src.name}`);
      State.addPanel.open=false;
      await render();
    });
  });

  document.querySelectorAll('[data-del-saved-meal]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id=btn.dataset.delSavedMeal;
      const updated=State.savedMeals.filter(m=>m.id!==id);
      State.savedMeals=await SavedMeals.set(updated);
      await render();
    });
  });

  const searchInput=document.getElementById('ap-search');
  if(searchInput){
    searchInput.focus();
    searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length);
    searchInput.addEventListener('input', Utils.debounce(async (e)=>{
      ap.query=e.target.value;
      ap.webResults=[]; ap.webQueriedFor=null; ap.webStatus='idle';
      await render();
    }, 180));
  }

  function pickFood(food){
    ap.pickedFood=food;
    const d=defaultQtyUnitFor(food);
    ap.selected={ name: food.name, qty:d.qty, unit:d.unit };
  }

  document.querySelectorAll('[data-pick-food]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const name=btn.dataset.pickFood;
      const food=FoodDB.findByName(name) || { name, per100:{cal:0,protein:0,carbs:0,fat:0}, units:{}, source:'db' };
      pickFood(food);
      await render();
    });
  });

  document.querySelectorAll('[data-pick-web]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const food=ap.webResults[Utils.num(btn.dataset.pickWeb)];
      if(!food) return;
      pickFood(food);
      await render();
    });
  });

  const webSearchBtn=document.getElementById('ap-web-search') || document.getElementById('ap-web-retry');
  if(webSearchBtn){
    webSearchBtn.addEventListener('click', async ()=>{
      const q=ap.query.trim();
      if(!q) return;
      ap.webStatus='loading'; ap.webQueriedFor=q;
      await render();
      try{
        const results=await OFF.searchByName(q, 15);
        ap.webResults=results; ap.webStatus='done';
      }catch(err){
        console.error('Open Food Facts search error', err);
        ap.webStatus='error';
      }
      await render();
    });
  }

  async function doBarcodeLookup(codeArg){
    const code=(codeArg!=null ? codeArg : ap.barcode).trim();
    if(!code) return;
    ap.barcode=code;
    ap.barcodeStatus='loading';
    await render();
    try{
      const food=await OFF.lookupBarcode(code);
      if(food){
        pickFood(food);
        ap.barcodeStatus='idle';
      } else {
        ap.barcodeStatus='notfound';
      }
    }catch(err){
      console.error('Open Food Facts barcode error', err);
      ap.barcodeStatus='error';
    }
    await render();
  }

  const barcodeInput=document.getElementById('ap-barcode');
  if(barcodeInput) barcodeInput.addEventListener('input', (e)=>{ ap.barcode=e.target.value; });
  const barcodeGo=document.getElementById('ap-barcode-go');
  if(barcodeGo) barcodeGo.addEventListener('click', ()=>doBarcodeLookup());
  if(barcodeInput) barcodeInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') doBarcodeLookup(); });

  const barcodeScanBtn=document.getElementById('ap-barcode-scan');
  if(barcodeScanBtn) barcodeScanBtn.addEventListener('click', ()=>{
    BarcodeScanner.open((code)=>{ doBarcodeLookup(code); });
  });

  const barcodePhotoBtn=document.getElementById('ap-barcode-photo-btn');
  const barcodePhotoInput=document.getElementById('ap-barcode-photo-input');
  if(barcodePhotoBtn && barcodePhotoInput){
    barcodePhotoBtn.addEventListener('click', ()=>{ barcodePhotoInput.value=''; barcodePhotoInput.click(); });
    barcodePhotoInput.addEventListener('change', async (e)=>{
      const file=e.target.files && e.target.files[0];
      if(!file) return;
      ap.barcodeStatus='photo-decoding';
      await render();
      try{
        const code=await BarcodeScanner.scanFile(file);
        await doBarcodeLookup(code);
      }catch(err){
        console.error('Photo barcode decode error', err);
        ap.barcodeStatus='photo-nobarcode';
        await render();
      }
    });
  }

  const qtyEl=document.getElementById('ap-qty');
  if(qtyEl) qtyEl.addEventListener('input', (e)=>{ if(ap.selected) ap.selected.qty=e.target.value; refreshSelectedPreview(); });
  const unitEl=document.getElementById('ap-unit');
  if(unitEl) unitEl.addEventListener('change', async (e)=>{ if(ap.selected) ap.selected.unit=e.target.value; await render(); });

  const clearSel=document.getElementById('ap-clear-select');
  if(clearSel) clearSel.addEventListener('click', async ()=>{ ap.selected=null; ap.pickedFood=null; await render(); });

  const confirmAdd=document.getElementById('ap-confirm-add');
  if(confirmAdd) confirmAdd.addEventListener('click', async ()=>{
    const food=ap.pickedFood;
    if(!food) return;
    if(Utils.inRange(ap.selected.qty,0.01,10000)==null){ showToast('Enter a quantity greater than 0'); return; }
    const m=FoodDB.macrosFor(food, ap.selected.qty, ap.selected.unit);
    const entry={
      id:Utils.uid('food'), mealType:ap.meal, name:food.name, quantity:Utils.num(ap.selected.qty,1), unit:ap.selected.unit,
      calories:m.calories, protein:m.protein, carbs:m.carbs, fat:m.fat,
      source:food.source||'db', sourceLabel:food.sourceLabel||'Food database'
    };
    const updated=entries.concat([entry]);
    await DayLog.set(dateKey, updated);
    showToast(`Added ${food.name}`);
    State.addPanel.open=false;
    await render();
  });

  // manual entry
  ['ap-mname','ap-mcal','ap-mprotein','ap-mcarbs','ap-mfat'].forEach(id=>{
    const el=document.getElementById(id);
    if(!el) return;
    el.addEventListener('input', (e)=>{
      const map={'ap-mname':'name','ap-mcal':'calories','ap-mprotein':'protein','ap-mcarbs':'carbs','ap-mfat':'fat'};
      ap.manual[map[id]]=e.target.value;
    });
  });
  const manualAdd=document.getElementById('ap-manual-add');
  if(manualAdd) manualAdd.addEventListener('click', async ()=>{
    const m=ap.manual;
    if(!m.name.trim()){ showToast('Enter a food name'); return; }
    // Blank = 0, but anything typed must be a realistic, non-negative amount.
    const val=(v,max)=> v===''||v==null ? 0 : Utils.inRange(v,0,max);
    const cal=val(m.calories,10000), p=val(m.protein,1000), c=val(m.carbs,1000), f=val(m.fat,1000);
    if(cal==null){ showToast('Calories must be between 0 and 10,000'); return; }
    if(p==null||c==null||f==null){ showToast('Protein, carbs and fat must be between 0 and 1,000 g'); return; }
    const entry={
      id:Utils.uid('food'), mealType:ap.meal, name:m.name.trim(), quantity:1, unit:'serving',
      calories:cal, protein:p, carbs:c, fat:f,
      source:'manual', sourceLabel:'Manual entry'
    };
    const updated=entries.concat([entry]);
    await DayLog.set(dateKey, updated);
    showToast(`Added ${entry.name}`);
    State.addPanel.open=false;
    await render();
  });
}

function refreshSelectedPreview(){
  // Lightweight re-render of just the selected-food row without losing search focus elsewhere
  const ap=State.addPanel;
  if(!ap.selected || !ap.pickedFood) return;
  const container=document.querySelector('.add-panel');
  if(!container) return;
  const rows=container.querySelectorAll('.result-row');
  if(rows.length){
    const m=FoodDB.macrosFor(ap.pickedFood, ap.selected.qty, ap.selected.unit);
    const massUnit = ap.pickedFood.isLiquid ? 'ml' : 'g';
    const metaEl=rows[0].querySelector('.result-meta');
    if(metaEl) metaEl.textContent = `${m.calories} kcal · P${m.protein} C${m.carbs} F${m.fat} (${m.grams}${massUnit})`;
  }
}

function wireWorkoutTab(dateKey, workout){
  const addExBtn=document.getElementById('wk-add-exercise');
  const exInput=document.getElementById('wk-exname');
  const wi=State.workoutInput;
  async function addExercise(name){
    name=(name!=null?name:(exInput.value||'')).trim();
    if(!name){ showToast('Enter an exercise name'); return; }
    const category=wi.category||'strength';
    // Re-read: this can be called from a suggestion list patched in after a later render.
    const key=Utils.dateKey(State.currentDate);
    const current=await WorkoutLog.get(key);
    await WorkoutLog.set(key, { entries: current.entries.concat([{ id:Utils.uid('ex'), exerciseName:name, category, sets:[] }]) });
    wi.exerciseName=''; wi.suggestions=[];
    showToast(`Added ${name}`);
    await render();
  }
  // Suggestions are patched in place rather than via render(): a full re-render recreated
  // the input on every keystroke, which dropped focus (and closed the phone keyboard).
  function refreshSuggestions(){
    wi.suggestions=ExerciseDB.search(wi.exerciseName, 6);
    const box=document.getElementById('ex-suggest-box');
    if(!box) return;
    box.innerHTML=renderExerciseSuggestions();
    box.querySelectorAll('[data-pick-ex-idx]').forEach(btn=>{
      btn.addEventListener('mousedown', e=>e.preventDefault()); // keep focus in the input
      btn.addEventListener('click', ()=>{ const s=wi.suggestions[Utils.num(btn.dataset.pickExIdx)]; if(s) addExercise(s.name); });
    });
  }
  if(addExBtn) addExBtn.addEventListener('click', ()=>addExercise());
  if(exInput){
    exInput.addEventListener('keydown', (e)=>{
      if(e.key==='Enter'){ e.preventDefault(); addExercise(); }
      if(e.key==='Escape'){ wi.exerciseName=''; exInput.value=''; refreshSuggestions(); }
    });
    exInput.addEventListener('input', (e)=>{ wi.exerciseName=e.target.value; refreshSuggestions(); });
    refreshSuggestions();
  }

  function paintSyncStatus(){
    const el=document.getElementById('ex-sync-status');
    if(!el) return;
    el.innerHTML=renderExerciseSyncStatus();
    const btn=document.getElementById('ex-sync-btn');
    if(btn) btn.addEventListener('click', runExerciseSync);
  }
  async function runExerciseSync(){
    if(State.exerciseSync.status==='syncing') return;
    State.exerciseSync={ status:'syncing', count:0, syncedAt:null };
    paintSyncStatus();
    try{
      const result=await ExerciseDB.sync((loaded)=>{
        State.exerciseSync={ status:'syncing', count:loaded, syncedAt:null };
        paintSyncStatus();
      });
      State.exerciseSync={ status:'done', count:result.items.length, syncedAt:result.syncedAt };
    }catch(err){
      console.error('wger sync error', err);
      State.exerciseSync={ status:'error', count:0, syncedAt:null };
    }
    // Patch in place so a sync finishing mid-typing doesn't wipe what's being typed.
    paintSyncStatus();
    if(document.getElementById('wk-exname')) refreshSuggestions();
  }
  paintSyncStatus();
  // The full wger library used to need a manual tap on "Sync"; until then search found nothing.
  if(State.exerciseSync.status==='idle') runExerciseSync();

  document.querySelectorAll('.setinput').forEach(el=>{
    const save=()=>{ const id=el.dataset.exid; State.setInputs[id]={ ...(State.setInputs[id]||{}), [el.dataset.field]:el.value }; };
    el.addEventListener('input', save); el.addEventListener('change', save);
  });

  const catSeg=document.getElementById('wk-category');
  if(catSeg) catSeg.addEventListener('click', async (e)=>{
    const b=e.target.closest('button[data-cat]'); if(!b) return;
    State.workoutInput.category=b.dataset.cat;
    await render();
  });

  document.querySelectorAll('[data-cardio-preset]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const label=btn.dataset.cardioPreset;
      State.workoutInput.exerciseName=label;
      const nameInput=document.getElementById('wk-exname');
      if(nameInput){ nameInput.value=label; nameInput.focus(); }
    });
  });

  document.querySelectorAll('[data-del-exercise]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id=btn.dataset.delExercise;
      const updated={ entries: workout.entries.filter(ex=>ex.id!==id) };
      await WorkoutLog.set(dateKey, updated);
      await render();
      const prEl=document.getElementById('pr-list'); if(prEl) renderPRListInto(prEl);
    });
  });

  document.querySelectorAll('[data-del-set]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const [exId, setId]=btn.dataset.delSet.split('|');
      const updated={ entries: workout.entries.map(ex=> ex.id!==exId ? ex : {...ex, sets:ex.sets.filter(s=>s.id!==setId)}) };
      await WorkoutLog.set(dateKey, updated);
      await render();
      const prEl=document.getElementById('pr-list'); if(prEl) renderPRListInto(prEl);
    });
  });

  document.querySelectorAll('[data-add-set]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const exId=btn.dataset.addSet;
      const exerciseEl=document.querySelector(`.exercise[data-exercise-id="${exId}"]`);
      const isCardio=exerciseEl.dataset.category==='cardio';
      let newSet;
      if(isCardio){
        const distance=exerciseEl.querySelector('[data-field="distance"]').value;
        const duration=exerciseEl.querySelector('[data-field="duration"]').value;
        if(distance===''&&duration===''){ showToast('Enter a distance and/or time'); return; }
        const d=distance===''?null:Utils.inRange(distance,0.01,500), t=duration===''?null:Utils.inRange(duration,0.1,1440);
        if(distance!==''&&d==null){ showToast('Distance must be between 0.01 and 500 km'); return; }
        if(duration!==''&&t==null){ showToast('Time must be between 0.1 and 1440 min'); return; }
        newSet={ id:Utils.uid('set'), reps:null, weight:null, weightUnit:'lb',
          distanceKm:d, durationSec: t!=null ? t*60 : null, notes:'' };
      } else {
        const reps=exerciseEl.querySelector('[data-field="reps"]').value;
        const weight=exerciseEl.querySelector('[data-field="weight"]').value;
        const weightUnit=exerciseEl.querySelector('[data-field="weightUnit"]').value;
        if(reps===''&&weight===''){ showToast('Enter reps and/or weight'); return; }
        const r=reps===''?null:Utils.inRange(reps,1,200);
        const w=weight===''?null:Utils.inRange(weight,0,weightUnit==='kg'?700:1500);
        if(reps!==''&&r==null){ showToast('Reps must be between 1 and 200'); return; }
        if(weight!==''&&w==null){ showToast(`Weight must be between 0 and ${weightUnit==='kg'?700:1500} ${weightUnit}`); return; }
        newSet={ id:Utils.uid('set'), reps:r!=null?Math.round(r):null, weight:w, weightUnit, distanceKm:null, durationSec:null, notes:'' };
        if(State.settings.weightUnit!==weightUnit){ State.settings.weightUnit=weightUnit; await Store.set('settings', State.settings); }
      }
      // Keep the unit, clear the numbers — the next set usually reuses the unit, not the values.
      State.setInputs[exId]={ weightUnit:(State.setInputs[exId]||{}).weightUnit };
      const updated={ entries: workout.entries.map(ex=> ex.id!==exId ? ex : {...ex, sets:ex.sets.concat([newSet])}) };
      await WorkoutLog.set(dateKey, updated);
      await render();
      const prEl=document.getElementById('pr-list'); if(prEl) renderPRListInto(prEl);
    });
  });
}

function wireCoachTab(){
  const input=document.getElementById('chat-input');
  const sendBtn=document.getElementById('chat-send');
  const body=document.getElementById('chat-body');
  if(body) body.scrollTop=body.scrollHeight;
  async function doSend(){
    const text=input.value;
    input.value='';
    await sendChatMessage(text);
  }
  if(sendBtn) sendBtn.addEventListener('click', doSend);
  if(input) input.addEventListener('keydown', (e)=>{ if(e.key==='Enter' && !State.chat.sending) doSend(); });

  const keyInput=document.getElementById('settings-gemini-key');
  const saveBtn=document.getElementById('settings-gemini-save');
  if(saveBtn) saveBtn.addEventListener('click', async ()=>{
    const key=(keyInput.value||'').trim();
    State.settings.geminiApiKey=key;
    await Store.set('settings', State.settings);
    showToast(key ? 'Gemini key saved — AI mode active' : 'Key cleared — using free FAQ mode');
    await render();
  });
  const clearBtn=document.getElementById('settings-gemini-clear');
  if(clearBtn) clearBtn.addEventListener('click', async ()=>{
    State.settings.geminiApiKey='';
    await Store.set('settings', State.settings);
    showToast('Key removed — using free FAQ mode');
    await render();
  });
}
