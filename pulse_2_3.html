<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PULSE — Training &amp; Nutrition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F6FB; --bg-soft:#E7EEF8;
    --surface:#FFFFFF; --surface-2:#F7FAFE;
    --ink:#1B2430; --ink-soft:#5C6B7F; --ink-faint:#98A6B8;
    --line:#DDE6F2; --line-strong:#C4D2E5;
    --accent:#2F6FED; --accent-ink:#FFFFFF; --accent-soft:#E1EAFB;
    --accent2:#123A66; --accent2-soft:#DCE7F4;
    --success:#3E7A52; --success-soft:#E4EFE6;
    --danger:#B23A3A; --danger-soft:#F5E3E1;
    --protein:#123A66; --carbs:#B5472C; --fat:#9A7B2E;
    --radius-lg:18px; --radius-md:12px; --radius-sm:8px;
    --shadow:0 1px 2px rgba(32,32,29,.04), 0 8px 24px rgba(32,32,29,.06);
    --font-display:'Fraunces','Sora',serif;
    --font-body:'Inter',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font-body);
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  button,input,select,textarea{font-family:inherit;}
  button{cursor:pointer;}
  a{color:var(--accent);}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}
  :focus-visible{outline:2px solid var(--accent2);outline-offset:2px;}

  .shell{max-width:1080px;margin:0 auto;padding:0 20px 100px;}
  header.topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 0 14px;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{
    width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);
    font-weight:700;font-size:15px;flex:none;
  }
  .brand .name{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:-.01em;}
  .who{display:flex;align-items:center;gap:10px;}
  .avatar{
    width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:13px;flex:none;border:none;
  }
  .iconbtn{
    background:var(--surface);border:1px solid var(--line);border-radius:50%;
    width:36px;height:36px;display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);font-size:15px;box-shadow:var(--shadow);
  }
  .iconbtn:hover{color:var(--ink);border-color:var(--line-strong);}

  nav.tabs{
    display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:4px;margin-bottom:20px;box-shadow:var(--shadow);
    overflow-x:auto;
  }
  nav.tabs button{
    flex:1;white-space:nowrap;border:none;background:transparent;border-radius:999px;
    padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--ink-soft);
  }
  nav.tabs button.active{background:var(--ink);color:#fff;}
  nav.tabs button:hover:not(.active){color:var(--ink);}

  .datebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;}
  .datebar .dnav{display:flex;align-items:center;gap:8px;}
  .datebar button.navbtn{
    background:var(--surface);border:1px solid var(--line);border-radius:50%;
    width:30px;height:30px;color:var(--ink);font-size:15px;box-shadow:var(--shadow);
  }
  .datebar .dlabel{font-family:var(--font-display);font-weight:600;font-size:16px;}
  .today-pill{
    font-size:11.5px;font-weight:700;border:1px solid var(--line-strong);color:var(--ink-soft);
    border-radius:999px;padding:4px 11px;background:var(--surface);
  }
  .today-pill:hover{color:var(--ink);}

  .grid{display:grid;grid-template-columns:1fr;gap:16px;}
  @media(min-width:820px){ .grid.overview{grid-template-columns:1.1fr .9fr;} .grid.two{grid-template-columns:1fr 1fr;} }

  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
    box-shadow:var(--shadow);padding:20px 20px 18px;
  }
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
  .card-title{font-family:var(--font-display);font-weight:700;font-size:16.5px;margin:0;}
  .card-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .link-btn{background:none;border:none;color:var(--accent);font-weight:600;font-size:12.5px;padding:0;}

  .ring-row{display:flex;align-items:center;gap:22px;margin:6px 0 14px;flex-wrap:wrap;}
  .ring-wrap{position:relative;flex:none;width:126px;height:126px;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring-num{font-family:var(--font-display);font-weight:700;font-size:24px;}
  .ring-lbl{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;}
  .macro-list{flex:1;min-width:150px;display:flex;flex-direction:column;gap:8px;}
  .macro-row{display:flex;align-items:center;gap:8px;font-size:12.5px;}
  .macro-row .swatch{width:9px;height:9px;border-radius:3px;flex:none;}
  .macro-row .bar-track{flex:1;height:6px;border-radius:4px;background:var(--bg-soft);overflow:hidden;}
  .macro-row .bar-fill{height:100%;border-radius:4px;}
  .macro-row .amt{color:var(--ink-soft);white-space:nowrap;}

  .week{display:flex;gap:6px;align-items:flex-end;height:56px;padding:6px 2px 0;}
  .week .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;}
  .week .bar{width:100%;max-width:22px;background:var(--bg-soft);border-radius:4px 4px 2px 2px;}
  .week .col.active .bar{background:var(--accent);}
  .week .dow{font-size:10px;color:var(--ink-faint);}
  .week .col.active .dow{color:var(--accent);font-weight:700;}

  .water-card .amount{font-family:var(--font-display);font-weight:700;font-size:26px;}
  .water-track{height:10px;border-radius:6px;background:var(--bg-soft);overflow:hidden;margin:10px 0 12px;}
  .water-fill{height:100%;background:var(--accent);border-radius:6px;}
  .water-btns{display:flex;flex-wrap:wrap;gap:6px;}
  .chip-btn{
    border:1px solid var(--line);background:var(--surface-2);border-radius:999px;
    padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--ink);
  }
  .chip-btn:hover{border-color:var(--line-strong);}
  .chip-btn.minus{color:var(--danger);}

  .meal-block{margin-bottom:14px;}
  .meal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .meal-name{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px;}
  .meal-name .dot{width:8px;height:8px;border-radius:50%;}
  .meal-cal{font-size:12px;color:var(--ink-soft);}
  .add-chip{background:var(--ink);color:#fff;border:none;border-radius:999px;width:26px;height:26px;font-size:16px;line-height:1;}
  .entry{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:9px 0;border-bottom:1px solid var(--line);
  }
  .entry:last-child{border-bottom:none;}
  .entry .info{min-width:0;}
  .entry .ename{font-weight:600;font-size:13.5px;}
  .entry .emeta{font-size:11.5px;color:var(--ink-soft);display:flex;gap:8px;flex-wrap:wrap;margin-top:1px;}
  .tag{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:1px 6px;border-radius:5px;}
  .tag.db{background:var(--accent2-soft);color:var(--accent2);}
  .tag.ai{background:var(--accent-soft);color:var(--accent);}
  .tag.web{background:var(--success-soft);color:var(--success);}
  .tag.manual{background:var(--bg-soft);color:var(--ink-soft);}
  .entry .eright{display:flex;align-items:center;gap:8px;flex:none;}
  .entry .ecal{font-weight:700;font-size:13.5px;}
  .del{background:none;border:none;color:var(--ink-faint);font-size:17px;width:22px;height:22px;border-radius:50%;}
  .del:hover{color:var(--danger);background:var(--danger-soft);}
  .empty{color:var(--ink-faint);font-size:12.5px;padding:8px 0;}

  .add-panel{margin-top:10px;padding:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-md);}
  .subtabs{display:flex;gap:4px;margin-bottom:10px;}
  .subtabs button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:12px;font-weight:600;color:var(--ink-soft);}
  .subtabs button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  input[type=text],input[type=number],input[type=search],select,textarea{
    width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;
    padding:9px 11px;font-size:13.5px;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent2);}
  .field{margin-bottom:9px;}
  .field label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;font-weight:600;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .btn{
    border:none;border-radius:9px;padding:9px 14px;font-weight:700;font-size:13px;
    background:var(--ink);color:#fff;
  }
  .btn:hover{opacity:.9;}
  .btn.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);}
  .btn.accent{background:var(--accent);}
  .btn:disabled{opacity:.5;cursor:default;}
  .result-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);}
  .result-row:last-child{border-bottom:none;}
  .result-name{font-weight:600;font-size:13px;}
  .result-meta{font-size:11.5px;color:var(--ink-soft);}
  .qty-input{width:64px;flex:none;}
  .status-line{font-size:12px;color:var(--ink-soft);padding:6px 0;}
  .status-line.err{color:var(--danger);}
  .foods-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;}
  .food-tile{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px;text-align:left;}
  .food-tile:hover{border-color:var(--accent2);}
  .food-tile .fn{font-weight:600;font-size:12.5px;}
  .food-tile .fm{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  .scanner-overlay{
    position:fixed;inset:0;z-index:1000;background:rgba(10,14,20,.92);
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;
  }
  .scanner-box{width:100%;max-width:420px;background:var(--surface);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow);}
  .scanner-box h3{margin:0 0 10px;font-family:var(--font-display);font-size:16px;}
  .scanner-video-region{width:100%;border-radius:var(--radius-md);overflow:hidden;background:#000;min-height:220px;}
  .scanner-hint{font-size:12px;color:var(--ink-soft);margin-top:10px;}
  .scanner-error{font-size:12.5px;color:var(--danger);margin-top:10px;}
  .scanner-close{margin-top:12px;width:100%;}

  .quicklog{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .quicklog input{flex:1;}
  .ex-suggest{
    position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:5;
    background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;
    box-shadow:var(--shadow);max-height:220px;overflow-y:auto;
  }
  .ex-suggest-row{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:8px 10px;}
  .ex-suggest-row:last-child{border-bottom:none;}
  .ex-suggest-row:hover{background:var(--surface-2);}
  .ex-suggest-row .fn{display:block;font-weight:600;font-size:12.5px;}
  .ex-suggest-row .fm{display:block;font-size:11px;color:var(--ink-soft);margin-top:1px;}

  .exlist{display:flex;flex-direction:column;gap:12px;}
  .exercise{border:1px solid var(--line);border-radius:var(--radius-md);padding:12px 14px;background:var(--surface-2);}
  .exercise-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .exercise-head .en{font-weight:700;font-size:14px;}
  .exercise-head .em{font-size:11px;color:var(--ink-soft);}
  .ex-suggestion{font-size:11.5px;color:var(--accent2);font-weight:600;margin-top:3px;}
  .sets{display:flex;flex-direction:column;gap:5px;margin-bottom:8px;}
  .setrow{display:flex;align-items:center;gap:8px;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 9px;}
  .setrow .sn{color:var(--ink-faint);font-size:11px;width:16px;}
  .setrow .sd{flex:1;}
  .addset-row{display:flex;gap:6px;align-items:center;}
  .addset-row input{flex:1;}

  .pr-list{display:flex;flex-direction:column;gap:8px;}
  .pr-row{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);}
  .pr-row:last-child{border-bottom:none;}
  .pr-row .pn{font-weight:600;}
  .pr-row .pv{color:var(--ink-soft);}

  .stat-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .stat-card{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-md);padding:12px 14px;}
  .stat-card .slabel{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;}
  .stat-card .sval{font-family:var(--font-display);font-weight:700;font-size:22px;margin-top:3px;}
  .stat-card .sdelta{font-size:11.5px;margin-top:3px;color:var(--ink-soft);}
  .stat-card .sdelta.down{color:var(--success);}
  .stat-card .sdelta.up{color:var(--danger);}
  .trend-chart{margin-top:8px;}
  .trend-dates{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-faint);margin-top:2px;}
  .history-list{display:flex;flex-direction:column;margin-top:2px;}
  .history-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .history-row:last-child{border-bottom:none;}
  .history-row .hdate{color:var(--ink-soft);font-size:11.5px;min-width:78px;}
  .history-row .hvals{flex:1;font-weight:600;}
  .history-row .hvals span{color:var(--ink-soft);font-weight:400;margin-left:6px;}

  .chat-shell{display:flex;flex-direction:column;height:min(70vh,620px);}
  .chat-body{flex:1;overflow-y:auto;padding:6px 2px;display:flex;flex-direction:column;gap:10px;}
  .msg{max-width:82%;padding:9px 13px;border-radius:14px;font-size:13.5px;line-height:1.45;white-space:pre-wrap;}
  .msg.user{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px;}
  .msg.assistant{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px;}
  .msg.system-note{align-self:center;background:var(--accent-soft);color:var(--accent);font-size:11.5px;padding:5px 10px;border-radius:999px;}
  .typing{align-self:flex-start;font-size:12px;color:var(--ink-soft);padding:4px 10px;}
  .chat-suggest{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;}
  .chat-input-row{display:flex;gap:8px;margin-top:10px;}
  .chat-input-row input{flex:1;}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;
    box-shadow:var(--shadow);z-index:50;max-width:90vw;text-align:center;
  }

  .setup-shell{max-width:560px;margin:40px auto;padding:0 20px 60px;}
  .setup-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:24px 22px;box-shadow:var(--shadow);}
  .setup-card h2{font-family:var(--font-display);margin:0 0 4px;font-size:22px;}
  .setup-card p.lead{margin:0 0 20px;font-size:13.5px;color:var(--ink-soft);}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--ink);}
  .seg button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .setup-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .goal-preview{margin-top:14px;padding:12px;background:var(--accent-soft);border-radius:10px;font-size:12.5px;color:var(--accent2);}

  .photos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;}
  .photo-tile{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);}
  .photo-tile img{width:100%;display:block;aspect-ratio:3/4;object-fit:cover;}
  .photo-tile .pdate{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:3px 6px;}
  .photo-tile .pdel{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;}
  .photo-feedback{font-size:12.5px;color:var(--ink-soft);margin-top:8px;padding:10px;background:var(--surface-2);border-radius:9px;}

  .footer-actions{text-align:center;margin-top:6px;}
  .footer-actions button{background:none;border:none;color:var(--ink-faint);font-size:12px;text-decoration:underline;}
  @media(max-width:600px){ .row3{grid-template-columns:1fr 1fr;} }
</style>
</head>

<div id="app" class="shell"><div style="padding:80px 0;text-align:center;color:var(--ink-soft);">Loading your log…</div></div>

<!-- Free, open-source barcode/QR scanner (camera-based) — https://github.com/mebjas/html5-qrcode -->
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
(function(){
"use strict";

/* =========================================================
   CONFIG
   ========================================================= */
const STORAGE_SCHEMA_VERSION = 2;
const MEAL_TYPES = [
  {id:'breakfast', label:'Breakfast', color:'var(--accent)'},
  {id:'lunch', label:'Lunch', color:'var(--accent2)'},
  {id:'dinner', label:'Dinner', color:'var(--success)'},
  {id:'snack', label:'Snacks', color:'#9A7B2E'}
];
const UNIT_OPTIONS = ['serving','g','oz','cup','tbsp','tsp','piece'];
// Open Food Facts items carry the package's own serving size, so give them a
// simpler, more relevant unit choice: portion (as printed on the label) vs.
// grams, or vs. millilitres for liquids — instead of the full curated-DB list.
function unitOptionsFor(food){
  if(!food) return UNIT_OPTIONS;
  if(food.source==='web'){
    const opts=[];
    if(food.units && food.units.serving!=null) opts.push('serving');
    opts.push(food.isLiquid ? 'ml' : 'g');
    return opts;
  }
  // Only offer "piece"/"serving" when the food actually defines one — otherwise they
  // silently meant an arbitrary 100 g. Volume units keep their usual approximations.
  const defined=Object.keys(food.units||{});
  return defined.concat(['g','oz','cup','tbsp','tsp'].filter(u=>!defined.includes(u)));
}
function defaultQtyUnitFor(food){
  if(food && food.source==='web'){
    if(food.units && food.units.serving!=null) return { qty:'1', unit:'serving' };
    return { qty:'100', unit: food.isLiquid?'ml':'g' };
  }
  const first=food && food.units && Object.keys(food.units)[0];
  return first ? { qty:'1', unit:first } : { qty:'100', unit:'g' }; // was 1 g → ~0 kcal logged by accident
}

/* =========================================================
   UTILS
   ========================================================= */
const Utils = {
  pad(n){ return String(n).padStart(2,'0'); },
  dateKey(d){ return d.getFullYear()+'-'+Utils.pad(d.getMonth()+1)+'-'+Utils.pad(d.getDate()); },
  parseDateKey(key){
    if(typeof key!=='string') return new Date();
    const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(key.trim());
    if(!m) return new Date();
    return new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
  },
  addDays(d,n){ const nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; },
  isSameDay(a,b){ return Utils.dateKey(a)===Utils.dateKey(b); },
  prettyDate(d){
    const todayKey=Utils.dateKey(new Date());
    const key=Utils.dateKey(d);
    if(key===todayKey) return 'Today';
    if(key===Utils.dateKey(Utils.addDays(new Date(),-1))) return 'Yesterday';
    if(key===Utils.dateKey(Utils.addDays(new Date(),1))) return 'Tomorrow';
    return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  },
  uid(prefix){ return (prefix||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); },
  // Escapes for both text and attribute contexts — quotes matter because names from
  // third-party data (wger, Open Food Facts) end up inside value="..." / data-*="...".
  esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); },
  // Parses user input; returns null when blank/non-numeric or outside [min,max].
  inRange(v,min,max){ if(v===''||v==null) return null; const n=Number(v); return Number.isFinite(n) && n>=min && n<=max ? n : null; },
  clamp(n,a,b){ return Math.max(a,Math.min(b,n)); },
  round(n,dp){ dp=dp==null?1:dp; const f=Math.pow(10,dp); return Math.round(((Number(n)||0)+Number.EPSILON)*f)/f; },
  roundInt(n){ return Math.round(Number(n)||0); },
  num(n,fallback){ const v=Number(n); return Number.isFinite(v)?v:(fallback||0); },
  isValidDateKey(s){ return typeof s==='string' && /^\d{4}-\d{2}-\d{2}$/.test(s); },
  mlToL(ml){ return ml/1000; },
  mlToOz(ml){ return ml/29.5735; },
  ozToMl(oz){ return oz*29.5735; },
  kgToLb(kg){ return kg*2.20462; },
  lbToKg(lb){ return lb*0.453592; },
  cmToFtIn(cm){ const totalIn=cm/2.54; const ft=Math.floor(totalIn/12); const inch=Math.round(totalIn-ft*12); return {ft,inch}; },
  ftInToCm(ft,inch){ return ((ft||0)*12+(inch||0))*2.54; },
  debounce(fn,ms){ let t=null; return function(...args){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,args),ms); }; },
  timeGreeting(){ const h=new Date().getHours(); return h<12?'Good morning':h<18?'Good afternoon':'Good evening'; },
  initials(name){ if(!name) return '?'; const parts=name.trim().split(/\s+/); return (parts[0][0]+(parts[1]?parts[1][0]:'')).toUpperCase(); },
  avatarColor(name){
    const colors=['#2F6FED','#123A66','#3E7A52','#9A7B2E','#6B4C8A'];
    if(!name) return colors[0];
    let h=0; for(let i=0;i<name.length;i++){ h=name.charCodeAt(i)+((h<<5)-h); }
    return colors[Math.abs(h)%colors.length];
  }
};

/* =========================================================
   STORAGE — persists via the artifact's key/value storage API
   (window.storage), namespaced with simple prefixed keys.
   Falls back to an in-memory map if storage is unavailable so
   the app still works within a single session.
   ========================================================= */
const Store = (function(){
  // mem is the source of truth for anything read/written this session — it's
  // checked BEFORE any network call, so a slow or rate-limited backend never
  // makes an in-session change appear to disappear. Writes are optimistic
  // (applied to mem immediately) and then queued to the backend one at a
  // time with a small gap + retry, so rapid actions (e.g. adding several
  // sets back-to-back) can't trip the platform's request rate limit.
  const mem = {};
  const hasRealStorage = !!(window.storage && typeof window.storage.get==='function');
  const LS_PREFIX='pulse:';
  let hasLocalStorage=false;
  try{ const t='__pulse_ls_test__'; window.localStorage.setItem(t,'1'); window.localStorage.removeItem(t); hasLocalStorage=true; }catch(e){ hasLocalStorage=false; }
  const THROTTLE_MS = 150;
  let queue = Promise.resolve();
  let warnedRecently = false;

  function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
  function isRateLimitErr(e){ return /rate limit/i.test((e && e.message) || String(e||'')); }

  function enqueue(task){
    const result = queue.then(task, task);
    queue = result.then(()=>sleep(THROTTLE_MS), ()=>sleep(THROTTLE_MS));
    return result;
  }

  async function withRetry(fn, retries){
    retries = retries==null ? 3 : retries;
    for(let attempt=0; ; attempt++){
      try{ return await fn(); }
      catch(e){
        if(!isRateLimitErr(e) || attempt>=retries) throw e;
        await sleep(500*(attempt+1));
      }
    }
  }

  function warnOnce(msg){
    if(warnedRecently) return;
    warnedRecently=true;
    if(typeof showToast==='function') showToast(msg);
    setTimeout(()=>{ warnedRecently=false; }, 15000);
  }

  async function get(key, fallback){
    if(Object.prototype.hasOwnProperty.call(mem,key)) return mem[key];
    if(!hasRealStorage){
      if(hasLocalStorage){
        try{
          const raw=window.localStorage.getItem(LS_PREFIX+key);
          const val = raw!=null ? JSON.parse(raw) : fallback;
          mem[key]=val;
          return val;
        }catch(e){ return fallback; }
      }
      return fallback;
    }
    try{
      const res = await enqueue(()=>withRetry(()=>window.storage.get(key, false)));
      let val=fallback;
      if(res && res.value!=null){ try{ val=JSON.parse(res.value); }catch(e){ val=fallback; } }
      mem[key]=val;
      return val;
    }catch(e){
      if(!isRateLimitErr(e)) mem[key]=fallback; // treat as "not found"; don't cache a rate-limit as empty
      else warnOnce('Storage is briefly rate-limited — your changes are kept for this session and syncing will retry automatically.');
      return fallback;
    }
  }

  async function set(key, value){
    mem[key]=value; // applied immediately so the UI and any subsequent get() never lose this
    if(!hasRealStorage){
      if(hasLocalStorage){
        try{ window.localStorage.setItem(LS_PREFIX+key, JSON.stringify(value)); }
        catch(e){ warnOnce('Could not save to browser storage (it may be full or disabled) — your changes are kept for this session.'); }
      }
      return true;
    }
    try{
      await enqueue(()=>withRetry(()=>window.storage.set(key, JSON.stringify(value), false)));
      return true;
    }catch(e){
      console.error('storage set failed for', key, e);
      warnOnce(isRateLimitErr(e)
        ? 'Storage is briefly rate-limited — your changes are kept for this session and syncing will retry automatically.'
        : 'Could not save to persistent storage — your changes are kept for this session.');
      return false;
    }
  }
  async function del(key){
    delete mem[key];
    if(!hasRealStorage){
      if(hasLocalStorage){ try{ window.localStorage.removeItem(LS_PREFIX+key); }catch(e){} }
      return;
    }
    try{ await enqueue(()=>withRetry(()=>window.storage.delete(key, false))); }catch(e){}
  }
  async function list(prefix){
    let keys=[];
    if(hasRealStorage){
      try{ const res=await enqueue(()=>withRetry(()=>window.storage.list(prefix, false))); keys=(res && res.keys)?res.keys.slice():[]; }
      catch(e){ keys=[]; }
    } else if(hasLocalStorage){
      try{
        for(let i=0;i<window.localStorage.length;i++){
          const lsKey=window.localStorage.key(i);
          if(lsKey && lsKey.indexOf(LS_PREFIX+prefix)===0) keys.push(lsKey.slice(LS_PREFIX.length));
        }
      }catch(e){}
    }
    Object.keys(mem).forEach(k=>{ if(k.indexOf(prefix)===0 && keys.indexOf(k)===-1) keys.push(k); });
    return keys;
  }
  return { get, set, del, list };
})();

/* =========================================================
   DAY / WORKOUT / WATER LOGS — persistence for dated records
   ========================================================= */
function isValidEntry(e){
  return e && typeof e==='object' && typeof e.name==='string';
}
function sanitizeEntries(arr){
  return Array.isArray(arr) ? arr.filter(isValidEntry).map(e=>({
    id:e.id||Utils.uid('food'), mealType:e.mealType||'snack', name:e.name,
    brand:e.brand||'', serving:e.serving||'', quantity:Utils.num(e.quantity,1), unit:e.unit||'serving',
    // Clamp so entries saved before input validation existed (negatives, typos) can't skew totals.
    calories:Utils.clamp(Utils.num(e.calories),0,10000), protein:Utils.clamp(Utils.num(e.protein),0,1000),
    carbs:Utils.clamp(Utils.num(e.carbs),0,1000), fat:Utils.clamp(Utils.num(e.fat),0,1000),
    source:e.source||'manual', sourceLabel:e.sourceLabel||''
  })) : [];
}
const DayLog = {
  async get(dateKey){ return sanitizeEntries(await Store.get('log:'+dateKey, [])); },
  async set(dateKey, entries){
    const clean=sanitizeEntries(entries);
    await Store.set('log:'+dateKey, clean);
    return clean;
  }
};
function sanitizeWorkout(w){
  if(!w || !Array.isArray(w.entries)) return {entries:[]};
  return {entries:w.entries.filter(e=>e&&e.exerciseName).map(e=>({
    id:e.id||Utils.uid('ex'), exerciseName:e.exerciseName, category:e.category||'',
    sets:Array.isArray(e.sets)?e.sets.map(s=>({
      id:s.id||Utils.uid('set'), reps:s.reps!=null?Utils.num(s.reps):null, weight:s.weight!=null?Utils.num(s.weight):null,
      weightUnit:s.weightUnit||'lb', distanceKm:s.distanceKm!=null?Utils.num(s.distanceKm):null,
      durationSec:s.durationSec!=null?Utils.num(s.durationSec):null, notes:s.notes||''
    })):[]
  }))};
}
const WorkoutLog = {
  async get(dateKey){ return sanitizeWorkout(await Store.get('workout:'+dateKey, {entries:[]})); },
  async set(dateKey, workout){
    const clean=sanitizeWorkout(workout);
    await Store.set('workout:'+dateKey, clean);
    return clean;
  }
};
const WaterLog = {
  async get(dateKey){ const w=await Store.get('water:'+dateKey,{ml:0}); return {ml:Utils.clamp(Utils.num(w&&w.ml),0,15000)}; },
  async set(dateKey, ml){ const clean={ml:Utils.clamp(Utils.num(ml),0,15000)}; await Store.set('water:'+dateKey, clean); return clean; }
};
const Profile = {
  async get(){ return await Store.get('profile', null); },
  async set(p){ await Store.set('profile', p); return p; }
};
function sanitizeWeightEntries(arr){
  return Array.isArray(arr) ? arr.filter(e=>e && typeof e==='object' && Utils.isValidDateKey(e.date))
    .map(e=>({
      id:e.id||Utils.uid('wt'), date:e.date,
      // Out-of-range values (typos from before validation existed) are dropped so they
      // can't skew charts or the adaptive-maintenance trend.
      weightKg: Utils.inRange(e.weightKg,20,400),
      bodyFatPct: Utils.inRange(e.bodyFatPct,2,70)
    }))
    .sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0) : [];
}
const WeightLog = {
  async getAll(){ return sanitizeWeightEntries(await Store.get('weightlog', [])); },
  async upsert(dateKey, weightKg, bodyFatPct){
    const all=await WeightLog.getAll();
    const idx=all.findIndex(e=>e.date===dateKey);
    const prev=idx>=0 ? all[idx] : {};
    // A blank field means "not re-entered today", not "erase it" — keep what was logged earlier.
    const entry={
      id: idx>=0 ? prev.id : Utils.uid('wt'), date:dateKey,
      weightKg: weightKg!=null && weightKg!=='' ? Utils.num(weightKg) : (prev.weightKg ?? null),
      bodyFatPct: bodyFatPct!=null && bodyFatPct!=='' ? Utils.num(bodyFatPct) : (prev.bodyFatPct ?? null)
    };
    if(idx>=0) all[idx]=entry; else all.push(entry);
    const clean=sanitizeWeightEntries(all);
    await Store.set('weightlog', clean);
    return clean;
  },
  async remove(id){
    const all=await WeightLog.getAll();
    const updated=all.filter(e=>e.id!==id);
    await Store.set('weightlog', updated);
    return updated;
  }
};

/* =========================================================
   SAVED MEALS — named bundles of food entries (e.g. "Greek
   yogurt + raspberries + protein powder") the user logs
   often, so re-adding the whole thing is one tap instead of
   re-searching each component every time.
   ========================================================= */
function sanitizeSavedMeals(arr){
  return Array.isArray(arr) ? arr.filter(m=>m && typeof m==='object' && typeof m.name==='string' && Array.isArray(m.items)).map(m=>({
    id: m.id || Utils.uid('meal'),

      source:e.source||'manual', sourceLabel:e.sourceLabel||''
    })),
    createdAt: m.createdAt || Date.now()
  })) : [];
}
const SavedMeals = {

};

/* =========================================================
   CALC
   ========================================================= */
const Calc = {
  totals(entries){
    return (entries||[]).reduce((acc,e)=>({
      calories:acc.calories+(Utils.num(e.calories)), protein:acc.protein+(Utils.num(e.protein)),
      carbs:acc.carbs+(Utils.num(e.carbs)), fat:acc.fat+(Utils.num(e.fat))
    }),{calories:0,protein:0,carbs:0,fat:0});
  },
  ACTIVITY:[
    {id:'sedentary',label:'Sedentary (little/no exercise)',mult:1.2},
    {id:'light',label:'Light (1-3 days/week)',mult:1.375},
    {id:'moderate',label:'Moderate (3-5 days/week)',mult:1.55},
    {id:'active',label:'Active (6-7 days/week)',mult:1.725},
    {id:'veryactive',label:'Very active (2x/day)',mult:1.9}
  ],
  GOALTYPES:[
    {id:'lose_fat',label:'Lose fat'}, {id:'maintain',label:'Maintain'},
    {id:'build_lean',label:'Build muscle & stay lean'}, {id:'bulk',label:'Bulk up'}
  ],
  formulaTDEE(p){
    const bmr = p.sex==='female' ? 10*p.weightKg+6.25*p.heightCm-5*p.age-161
      : p.sex==='male' ? 10*p.weightKg+6.25*p.heightCm-5*p.age+5
      : 10*p.weightKg+6.25*p.heightCm-5*p.age-78;
    const act = Calc.ACTIVITY.find(a=>a.id===p.activityLevel) || Calc.ACTIVITY[1];
    return bmr*act.mult;
  },
  goalFactors(goalType){
    if(goalType==='lose_fat') return { calMult:0.82, proteinPerKg:2.2 };
    if(goalType==='build_lean') return { calMult:1.08, proteinPerKg:2.0 };
    if(goalType==='bulk') return { calMult:1.15, proteinPerKg:1.8 };
    return { calMult:1, proteinPerKg:1.8 };
  },
  computeGoalsFromProfile(p){
    return Calc.goalsFromTDEE(p, Calc.formulaTDEE(p));
  },
  goalsFromTDEE(p, tdee){
    const { calMult, proteinPerKg } = Calc.goalFactors(p.goalType);
    const calories=Math.round(tdee*calMult);
    const protein=Math.round(p.weightKg*proteinPerKg);
    const fat=Math.round((calories*0.25)/9);
    const carbs=Math.max(0,Math.round((calories-protein*4-fat*9)/4));
    const waterMl=Math.round(Utils.clamp(p.weightKg*33,1800,4000));
    return {calories,protein,carbs,fat,waterMl};
  },
  // Epley is only meaningful for low-rep sets; capping at 12 reps stops a high-rep set
  // (or a typo like 100000 reps) from inventing an absurd "max".
  epley1RM(weight,reps){ if(!(weight>0)||!(reps>0)) return 0; return weight*(1+Math.min(reps,12)/30); },
  bestSetSummary(sets){
    let best=null;
    (sets||[]).forEach(s=>{
      if(s.weight>0 && s.reps>0){
        const unit=s.weightUnit||'lb';
        const est=Calc.epley1RM(s.weight,s.reps);
        const estKg = unit==='kg' ? est : Utils.lbToKg(est); // compare across units on one scale
        if(!best || estKg>best.estKg) best={weight:s.weight,reps:s.reps,est,estKg,weightUnit:unit};
      }
    });
    return best;
  },
  formatDuration(sec){
    sec=Math.max(0,Math.round(Utils.num(sec)));
    const mm=Math.floor(sec/60), ss=sec%60;
    return mm+':'+Utils.pad(ss);
  },
  paceSecPerKm(durationSec, distanceKm){
    if(!durationSec || !distanceKm) return null;
    const p=durationSec/distanceKm;
    return isFinite(p) ? p : null;
  },
  formatPace(durationSec, distanceKm){
    const p=Calc.paceSecPerKm(durationSec, distanceKm);
    return p==null ? '' : Calc.formatDuration(p)+'/km';
  },
  bestPaceSummary(sets){
    let best=null;
    (sets||[]).forEach(s=>{
      const pace=Calc.paceSecPerKm(s.durationSec, s.distanceKm);
      if(pace!=null && (!best || pace<best.pace)) best={pace, distanceKm:s.distanceKm, durationSec:s.durationSec};
    });
    return best;
  },
  volumeInfo(sets){
    let repsVol=0, hasReps=false, distSum=0, hasDist=false;
    (sets||[]).forEach(s=>{
      if(s.reps!=null){ hasReps=true; repsVol += s.reps*(s.weight!=null && s.weight>0 ? s.weight : 1); }
      if(s.distanceKm!=null){ hasDist=true; distSum += s.distanceKm; }
    });
    if(hasReps) return {type:'volume', value:repsVol};
    if(hasDist) return {type:'distance', value:distSum};
    return null;
  }
};

  search(query, limit){
    limit=limit||8;
    const q=(query||'').trim().toLowerCase();
    if(!q) return [];
    const starts=[], contains=[];
    FoodDB.items.forEach(f=>{
      const n=f.name.toLowerCase();
      if(n.startsWith(q)) starts.push(f);
      else if(n.includes(q)) contains.push(f);
    });
    return starts.concat(contains).slice(0,limit);
  },
  findByName(name){
    const q=(name||'').trim().toLowerCase();
    if(!q) return null;
    return FoodDB.items.find(f=>f.name.toLowerCase()===q)
      || FoodDB.items.find(f=>f.name.toLowerCase().includes(q))
      || null;
  },
  gramsFor(food, quantity, unit){
    quantity=Utils.num(quantity,1); unit=(unit||'g').toLowerCase();
    const u=food.units||{};
    if(unit==='g'||unit==='gram'||unit==='grams') return quantity;
    if(unit==='ml'||unit==='milliliter'||unit==='milliliters'||unit==='millilitre'||unit==='millilitres') return quantity; // OFF reports macros per 100 of whatever unit the product uses (g or ml) — 1:1 numerically
    if(unit==='kg') return quantity*1000;
    if(unit==='oz'||unit==='ounce'||unit==='ounces') return quantity*28.3495;
    if(unit==='lb'||unit==='pound'||unit==='pounds') return quantity*453.592;
    if(unit==='cup'||unit==='cups') return quantity*(u.cup||240);
    if(unit==='tbsp'||unit==='tablespoon'||unit==='tablespoons') return quantity*(u.tbsp||15);
    if(unit==='tsp'||unit==='teaspoon'||unit==='teaspoons') return quantity*(u.tsp||5);
    if(unit==='piece'||unit==='pieces'||unit==='slice'||unit==='slices') return quantity*(u.piece||100);
    if(unit==='serving'||unit==='servings'||unit==='container'||unit==='bowl') return quantity*(u.serving||100);
    return quantity*100;
  },
  macrosFor(food, quantity, unit){
    const grams=FoodDB.gramsFor(food,quantity,unit);
    const factor=grams/100;
    return {
      calories:Utils.roundInt(food.per100.cal*factor), protein:Utils.round(food.per100.protein*factor),
      carbs:Utils.round(food.per100.carbs*factor), fat:Utils.round(food.per100.fat*factor), grams:Utils.round(grams,0)
    };
  }
};

/* =========================================================
   OPEN FOOD FACTS — free, keyless food database (millions of
   products). Used as a fallback/extension to the curated
   FoodDB above: local list first (instant, offline), then
   Open Food Facts for anything not in the curated list, plus
   barcode lookup. Every product is normalized into the same
   {name, per100:{cal,protein,carbs,fat}} shape FoodDB uses,
   so FoodDB.gramsFor/macrosFor work on it unchanged.
   ========================================================= */
const OFF = (function(){
  const BASE='https://world.openfoodfacts.org';
  const FIELDS='code,product_name,product_name_fr,generic_name,brands,quantity,nutriments,serving_size,serving_quantity,serving_quantity_unit,product_quantity_unit';

  function mapProduct(p){
    if(!p) return null;
    const n=p.nutriments||{};
    const cal=n['energy-kcal_100g'];
    if(cal==null || isNaN(Utils.num(cal))) return null; // unusable without calories
    const baseName=(p.product_name_fr||p.product_name||p.generic_name||'').trim();
    if(!baseName) return null;
    const name = p.brands ? `${baseName} (${p.brands.split(',')[0].trim()})` : baseName;
    // OFF reports macros per "100" of whatever unit the product uses (g for solids,
    // ml for liquids — it does not distinguish the two numerically). We mirror that:
    // isLiquid just changes which unit label we show (ml vs g), the math is identical.
    const isLiquid = p.serving_quantity_unit==='ml' || p.product_quantity_unit==='ml';
    const servingQty = p.serving_quantity!=null ? Utils.num(p.serving_quantity) : null;
    const units={};
    if(servingQty && servingQty>0) units.serving=servingQty;
    return {
      name,
      per100:{
        cal:Utils.num(cal),
        protein:Utils.num(n['proteins_100g']),
        carbs:Utils.num(n['carbohydrates_100g']),
        fat:Utils.num(n['fat_100g'])
      },
      units,
      isLiquid,
      servingLabel: p.serving_size ? p.serving_size.trim() : null,
      code:p.code||'',
      source:'web',
      sourceLabel:'Open Food Facts'
    };
  }

  function extractProducts(data){
    const seen=new Set(); const out=[];
    (data.products||[]).forEach(p=>{
      const mapped=mapProduct(p);
      if(mapped && !seen.has(mapped.name)){ seen.add(mapped.name); out.push(mapped); }
    });
    return out;
  }

  async function searchByName(query, pageSize){
    pageSize=pageSize||15;
    // The legacy CGI search endpoint is used as the primary path — in practice
    // it has proven more reliable/CORS-friendly from the browser than /api/v2/search.
    // /api/v2/search is kept as a fallback in case that ever flips.
    try{
      const url=`${BASE}/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=${pageSize}`;
      const res=await fetch(url);
      if(!res.ok) throw new Error('off-search-http-'+res.status);
      return extractProducts(await res.json());
    }catch(primaryErr){
      const url=`${BASE}/api/v2/search?search_terms=${encodeURIComponent(query)}&page_size=${pageSize}&fields=${FIELDS}`;
      const res=await fetch(url);
      if(!res.ok) throw new Error('off-search-http-'+res.status);
      return extractProducts(await res.json());
    }
  }

  async function lookupBarcode(code){
    const clean=(code||'').replace(/\D/g,'');
    if(!clean) return null;
    const res=await fetch(`${BASE}/api/v0/product/${encodeURIComponent(clean)}.json`);
    if(!res.ok) throw new Error('off-barcode-http-'+res.status);
    const data=await res.json();
    if(data.status!==1 || !data.product) return null;
    return mapProduct(data.product);
  }

  return { searchByName, lookupBarcode };
})();

/* =========================================================
   WGER — free, keyless exercise database (~900+ exercises with
   muscles/equipment/category). The API has no working full-text
   search endpoint, so we sync the whole library once (cached
   locally) and search it client-side, same pattern as FoodDB.
   ========================================================= */
const ExerciseDB = (function(){
  const BASE='https://wger.de/api/v2';
  const CACHE_KEY='wger_exercise_cache_v2'; // v2 adds French+English alt names; old caches re-sync automatically
  const PAGE_SIZE=100;
  const PREFERRED_LANGS=[12,2]; // French, then English
  let cache=null; // {syncedAt, items:[...]}

  function pickTranslation(translations){
    for(const lang of PREFERRED_LANGS){
      const t=(translations||[]).find(t=>t.language===lang && t.name);
      if(t) return t;
    }
    return (translations||[]).find(t=>t.name) || null;
  }

  function mapExercise(raw){
    const t=pickTranslation(raw.translations);
    if(!t) return null;
    // Keep the other-language name and aliases searchable, so "bench press" finds
    // "Développé couché" and vice versa.
    const alt=[];
    (raw.translations||[]).forEach(tr=>{
      if(!PREFERRED_LANGS.includes(tr.language)) return;
      if(tr.name && tr.name!==t.name) alt.push(tr.name);
      (tr.aliases||[]).forEach(a=>{ const s=typeof a==='string'?a:(a&&a.alias); if(s) alt.push(s); });
    });
    return {
      id:raw.id,
      name:t.name,
      alt,
      category:(raw.category && raw.category.name) || '',
      muscles:(raw.muscles||[]).map(m=>m.name_en||m.name),
      musclesSecondary:(raw.muscles_secondary||[]).map(m=>m.name_en||m.name),
      equipment:(raw.equipment||[]).map(e=>e.name),
      imageUrl:(raw.images && raw.images[0] && raw.images[0].image) || null
    };
  }

  async function loadCache(){
    if(cache) return cache;
    cache=await Store.get(CACHE_KEY, null);
    return cache;
  }

  async function sync(onProgress){
    let offset=0, all=[];
    for(;;){
      const res=await fetch(`${BASE}/exerciseinfo/?limit=${PAGE_SIZE}&offset=${offset}&format=json`);
      if(!res.ok) throw new Error('wger-http-'+res.status);
      const data=await res.json();
      const mapped=(data.results||[]).map(mapExercise).filter(Boolean);
      all=all.concat(mapped);
      if(onProgress) onProgress(all.length, data.count||all.length);
      if(!data.next) break;
      offset+=PAGE_SIZE;
      await new Promise(r=>setTimeout(r,120)); // be gentle with the free public API
    }
    cache={ syncedAt:Date.now(), items:all };
    await Store.set(CACHE_KEY, cache);
    return cache;
  }

  async function status(){
    const c=await loadCache();
    return { synced: !!(c && c.items && c.items.length), count: c ? c.items.length : 0, syncedAt: c ? c.syncedAt : null };
  }

  // Built-in staples (FR + EN names) so search works instantly, offline, and before
  // the wger library has finished downloading.
  const BUILTIN=[
    ['Développé couché','Bench Press','Chest','Barbell'],['Développé incliné','Incline Bench Press','Chest','Barbell'],
    ['Développé couché haltères','Dumbbell Bench Press','Chest','Dumbbell'],['Écarté haltères','Dumbbell Fly','Chest','Dumbbell'],
    ['Pompes','Push-up','Chest','Body weight'],['Dips','Dips','Chest','Body weight'],
    ['Squat','Back Squat','Legs','Barbell'],['Squat avant','Front Squat','Legs','Barbell'],['Squat goblet','Goblet Squat','Legs','Dumbbell'],
    ['Presse à cuisses','Leg Press','Legs','Machine'],['Fentes','Lunges','Legs','Dumbbell'],['Fentes bulgares','Bulgarian Split Squat','Legs','Dumbbell'],
    ['Leg extension','Leg Extension','Legs','Machine'],['Leg curl','Leg Curl','Legs','Machine'],['Mollets debout','Standing Calf Raise','Calves','Machine'],
    ['Soulevé de terre','Deadlift','Back','Barbell'],['Soulevé de terre roumain','Romanian Deadlift','Legs','Barbell'],['Hip thrust','Hip Thrust','Glutes','Barbell'],
    ['Tractions','Pull-up','Back','Body weight'],['Tractions supination','Chin-up','Back','Body weight'],['Tirage vertical','Lat Pulldown','Back','Machine'],
    ['Rowing barre','Barbell Row','Back','Barbell'],['Rowing haltère','Dumbbell Row','Back','Dumbbell'],['Tirage horizontal','Seated Cable Row','Back','Cable'],
    ['Développé militaire','Overhead Press','Shoulders','Barbell'],['Développé épaules haltères','Dumbbell Shoulder Press','Shoulders','Dumbbell'],
    ['Élévations latérales','Lateral Raise','Shoulders','Dumbbell'],['Face pull','Face Pull','Shoulders','Cable'],['Oiseau','Rear Delt Fly','Shoulders','Dumbbell'],
    ['Curl biceps','Biceps Curl','Arms','Dumbbell'],['Curl marteau','Hammer Curl','Arms','Dumbbell'],['Curl barre','Barbell Curl','Arms','Barbell'],
    ['Extension triceps poulie','Triceps Pushdown','Arms','Cable'],['Barre au front','Skull Crusher','Arms','Barbell'],['Extension triceps nuque','Overhead Triceps Extension','Arms','Dumbbell'],
    ['Gainage','Plank','Abs','Body weight'],['Crunch','Crunch','Abs','Body weight'],['Relevé de jambes','Hanging Leg Raise','Abs','Body weight'],['Russian twist','Russian Twist','Abs','Body weight'],
    ['Course','Run','Cardio',''],['Marche','Walk','Cardio',''],['Vélo','Bike','Cardio',''],['Rameur','Rowing Machine','Cardio','Machine'],
    ['Corde à sauter','Jump Rope','Cardio',''],['Elliptique','Elliptical','Cardio','Machine'],['Natation','Swimming','Cardio',''],['Burpees','Burpees','Cardio','Body weight']
  ].map(([fr,en,category,eq])=>({ name:fr, alt:[en], category, equipment:eq?[eq]:[], builtin:true }));

  function norm(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }

  function search(query, limit){
    limit=limit||8;
    const q=norm(query);
    if(!q) return [];
    const tokens=q.split(' ');
    const seen=new Set(), scored=[];
    BUILTIN.concat((cache && cache.items) || []).forEach(ex=>{
      const name=norm(ex.name);
      const hay=name+' '+(ex.alt||[]).map(norm).join(' ');
      if(!tokens.every(t=>hay.includes(t))) return; // every word, any order, accents ignored
      if(seen.has(name)) return;
      seen.add(name);
      // Best of name and alt names: exact > starts-with > contains — so "bench press" ranks
      // Développé couché (alt "Bench Press") above "Bench Press Isometric".
      const rank=s=> s===q ? 0 : s.startsWith(q) ? 1 : s.includes(q) ? 2 : 4;
      const score=Math.min(rank(name), ...(ex.alt||[]).map(a=>rank(norm(a))+0.25));
      scored.push({ ex, score: score + (ex.builtin?0:0.5) }); // staples first on ties
    });
    return scored.sort((a,b)=>a.score-b.score || a.ex.name.length-b.ex.name.length).slice(0,limit).map(s=>s.ex);
  }

  return { loadCache, sync, status, search };
})();

/* =========================================================
   BARCODE SCANNER — free, camera-based barcode reading via the
   open-source html5-qrcode library (loaded from a CDN, no key/
   account needed). Rendered as an overlay appended directly to
   <body> — deliberately OUTSIDE the #app tree that render()
   replaces wholesale — so a re-render elsewhere in the app can
   never orphan a live camera stream while the scanner is open.
   Requires a secure context (https:// or localhost); it will
   not work when the file is opened directly as file:// in most
   browsers — that's a browser security rule, not a bug here.
   ========================================================= */
const BarcodeScanner = (function(){
  let instance=null;
  let overlayEl=null;
  let fileRegionEl=null;

  // Retail product barcode formats (not QR) — restricting to these both speeds up
  // decoding and avoids the library defaulting to QR-optimized detection, which
  // otherwise struggles with the wide, thin 1D barcodes used on food packaging.
  function barcodeFormats(){
    return [
      Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.UPC_EAN_EXTENSION, Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39, Html5QrcodeSupportedFormats.ITF
    ];
  }

  function buildOverlay(){
    const el=document.createElement('div');
    el.className='scanner-overlay';
    el.innerHTML=`
      <div class="scanner-box">
        <h3>Scan a barcode</h3>
        <div class="scanner-video-region" id="scanner-video-region"></div>
        <div class="scanner-hint">Hold the barcode flat, well-lit, filling the box, about 10-15cm from the camera. It can take a few seconds.</div>
        <div class="scanner-error" id="scanner-error" hidden></div>
        <button type="button" class="btn secondary scanner-close" id="scanner-cancel">Cancel</button>
      </div>`;
    document.body.appendChild(el);
    return el;
  }

  function showError(msg){
    if(!overlayEl) return;
    const el=overlayEl.querySelector('#scanner-error');
    if(el){ el.textContent=msg; el.hidden=false; }
  }

  async function open(onDetected){
    if(overlayEl) return; // already open
    if(typeof Html5Qrcode==='undefined'){
      showToast("Scanner library failed to load — check your internet connection.");
      return;
    }
    overlayEl=buildOverlay();
    document.getElementById('scanner-cancel').addEventListener('click', close);
    try{
      instance=new Html5Qrcode('scanner-video-region', { formatsToSupport:barcodeFormats(), verbose:false });
      await instance.start(
        { facingMode:{ ideal:'environment' } },
        {
          fps:10,
          // Wide/short box matches a barcode's shape (vs. the square default meant for QR)
          qrbox:{ width:280, height:120 },
          aspectRatio:1.777,
          videoConstraints:{ facingMode:{ ideal:'environment' }, width:{ ideal:1280 }, height:{ ideal:720 } }
        },
        async (decodedText)=>{
          const code=decodedText;
          await close();
          onDetected(code);
        },
        ()=>{ /* no barcode in this frame — expected on most frames, ignore */ }
      );
    }catch(err){
      console.error('Barcode scanner error', err);
      showError("Couldn't access the camera. Make sure this page is loaded over https:// (or localhost) and camera access is allowed, or enter the barcode manually below.");
    }
  }

  async function close(){
    if(instance){
      try{ await instance.stop(); }catch(e){}
      try{ instance.clear(); }catch(e){}
      instance=null;
    }
    if(overlayEl){ overlayEl.remove(); overlayEl=null; }
  }

  // Decode a barcode from a still photo (e.g. from a phone's native camera app via
  // <input type="file" accept="image/*" capture="environment">) instead of live
  // video. Often more reliable than continuous scanning — the phone's own camera
  // app handles focus/exposure before the photo is even taken.
  async function scanFile(file){
    if(typeof Html5Qrcode==='undefined') throw new Error('scanner-lib-not-loaded');
    if(!fileRegionEl){
      fileRegionEl=document.createElement('div');
      fileRegionEl.id='photo-scan-region';
      fileRegionEl.style.cssText='position:absolute;left:-99999px;top:-99999px;width:300px;height:300px;';
      document.body.appendChild(fileRegionEl);
    }
    const fileInstance=new Html5Qrcode('photo-scan-region', { formatsToSupport:barcodeFormats(), verbose:false });
    try{
      const decodedText=await fileInstance.scanFile(file, false);
      return decodedText;
    } finally {
      try{ fileInstance.clear(); }catch(e){}
    }
  }

  return { open, close, scanFile };
})();

async function boot(){
  State.profile = await Profile.get();
  const savedSettings = await Store.get('settings', null);
  if(savedSettings) State.settings = Object.assign({geminiApiKey:''}, savedSettings);
  const exStatus = await ExerciseDB.status();

  await render();
}

async function render(){
  const app=document.getElementById('app');
  if(!State.profile){
    app.innerHTML = renderSetup();
    wireSetup();
    return;
  }
  const dateKey=Utils.dateKey(State.currentDate);
  const [entries, workout, water, weightHistory] = await Promise.all([
    DayLog.get(dateKey), WorkoutLog.get(dateKey), WaterLog.get(dateKey), WeightLog.getAll()
  ]);
  const weekTotals = await getWeekCalories(State.currentDate);
  if(State.activeTab==='progress') State.adaptive = await computeAdaptiveTDEE(State.profile, weightHistory);
  if(State.activeTab==='today' && State.addPanel.open) State.recentFoods = await computeRecentFoods(State.currentDate, 8);
  app.innerHTML = renderShell(dateKey, entries, workout, water, weekTotals, weightHistory);
  wireShell(dateKey, entries, workout, water, weightHistory);
}

/* =========================================================
   WEEK CALORIES (for the small bar chart)
   ========================================================= */
async function getWeekCalories(anchorDate){
  const days=[];
  for(let i=6;i>=0;i--) days.push(Utils.addDays(anchorDate,-i));
  const results=await Promise.all(days.map(async d=>{
    const entries=await DayLog.get(Utils.dateKey(d));
    return {date:d, cal:Calc.totals(entries).calories};
  }));
  return results;
}

/* =========================================================
   ADAPTIVE MAINTENANCE (TDEE) — instead of trusting the formula
   forever, estimate real maintenance from what actually happened:
   average logged intake minus the energy implied by the weight
   trend (~7700 kcal per kg). Blended with the formula while data
   is thin, so early estimates don't swing wildly.
   ========================================================= */
const ADAPTIVE_WINDOW_DAYS=28;
const KCAL_PER_KG=7700;
async function computeAdaptiveTDEE(profile, weightHistory){
  // Window ends yesterday: today's log is usually incomplete and would drag the average intake down.
  const startKey=Utils.dateKey(Utils.addDays(new Date(),-ADAPTIVE_WINDOW_DAYS));
  const start=Utils.parseDateKey(startKey);
  const pts=weightHistory.filter(e=>e.weightKg!=null && e.date>=startKey)
    .map(e=>({ t:(Utils.parseDateKey(e.date)-start)/86400000, w:e.weightKg }));
  const cals=await Promise.all(Array.from({length:ADAPTIVE_WINDOW_DAYS},(_,i)=>
    DayLog.get(Utils.dateKey(Utils.addDays(start,i))).then(en=>Calc.totals(en).calories)));
  const logged=cals.filter(c=>c>0);
  const formula=Calc.formulaTDEE(profile);
  const base={ formula, loggedDays:logged.length, weighIns:pts.length };
  const span=pts.length ? pts[pts.length-1].t-pts[0].t : 0;
  if(logged.length<7 || pts.length<3 || span<10) return { ...base, ready:false, span };
  // Least-squares slope of weight vs. day: far less sensitive to one noisy weigh-in than first-vs-last.
  const n=pts.length, mt=pts.reduce((s,p)=>s+p.t,0)/n, mw=pts.reduce((s,p)=>s+p.w,0)/n;
  let num=0, den=0;
  pts.forEach(p=>{ num+=(p.t-mt)*(p.w-mw); den+=(p.t-mt)*(p.t-mt); });
  const slope=den ? num/den : 0;
  const avgIntake=logged.reduce((s,c)=>s+c,0)/logged.length;
  const measured=avgIntake - slope*KCAL_PER_KG;
  const confidence=Math.min(1, logged.length/21);
  const tdee=Utils.clamp(confidence*measured + (1-confidence)*formula, 1000, 6000);
  return { ...base, ready:true, span, tdee, avgIntake, slopeKgPerWeek:slope*7, confidence,
           latestWeight: pts[pts.length-1].w };
}

/* Most-logged foods over the last 3 weeks, for one-tap re-logging. */
async function computeRecentFoods(anchorDate, limit){
  const map={};
  for(let i=0;i<21;i++){
    const entries=await DayLog.get(Utils.dateKey(Utils.addDays(anchorDate,-i)));
    entries.forEach(e=>{
      const k=e.name.trim().toLowerCase();
      if(map[k]) map[k].count++;
      else map[k]={ entry:e, count:1, lastSeen:i }; // i ascends from today, so first hit = most recent version
    });
  }
  return Object.values(map)
    .sort((a,b)=> b.count-a.count || a.lastSeen-b.lastSeen)
    .slice(0,limit)
    .map(x=>({ ...x.entry, count:x.count }));
}

function ringSvg(pct, color){
  pct=Utils.clamp(pct,0,1);
  const r=52, c=2*Math.PI*r, offset=c*(1-pct);
  return `<svg width="126" height="126" viewBox="0 0 126 126">
    <circle cx="63" cy="63" r="${r}" fill="none" stroke="var(--bg-soft)" stroke-width="12"/>
    <circle cx="63" cy="63" r="${r}" fill="none" stroke="${color}" stroke-width="12"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"/>
  </svg>`;
}
